name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
      - name: Build site
        run: cd site && zola build --output-dir ../public
      - name: Install chrome for PDF export
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Build PDFs (audience × language)
        timeout-minutes: 5
        env:
          LSC_BROWSER: chrome
        run: |
          mkdir -p site/public
          cp -r public/* site/public/
          python3 scripts/build_pdfs.py || echo "::warning::PDF build failed; site will deploy without PDFs"
          if [ -d site/public/pdf ]; then cp -r site/public/pdf public/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
