title_en = "Writing and Rhetoric"
objective_es = "Entrenar formalmente las habilidades de comunicación escrita y oral sobre las que todo lo demás en el programa descansa."
objective_en = "To formally train the written and oral communication skills on which everything else in the program rests."
concrete_example_es = "Un ensayo de 4000 palabras que defienda una posición disputada sobre gobernanza de IA, con historial de revisión completo (borradores, devoluciones de pares, reescrituras) y una defensa oral grabada ante un panel que incluye al menos un revisor externo."
concrete_example_en = "A 4000-word essay arguing a contested position on AI governance, with full revision history (drafts, peer feedback, rewrites) and a recorded oral defense before a panel that includes at least one external reviewer."
structure_es = "Énfasis en escritura durante las primeras ocho semanas. Énfasis oral durante las segundas ocho semanas. Ambas se practican durante todo el Studio. El material proviene de las materias cursadas en simultáneo: los estudiantes escriben y presentan sobre contenido real, no sobre ejercicios abstractos."
structure_en = "Writing emphasis in the first eight weeks. Oral emphasis in the second eight weeks. Both practiced throughout. Material comes from courses being taken simultaneously: students write and present about real content, not abstract exercises."
deliverables_es = ["Portfolio de ensayos reescritos con historia completa de revisión: borradores originales, feedback recibido y reescrituras", "Presentaciones orales grabadas con autoevaluación", "Memo de responsabilidad sobre afirmaciones, evidencia usada y límites de lo que el equipo puede defender", "Defensa oral final sin notas"]
deliverables_en = ["Portfolio of rewritten essays with complete revision history: original drafts, feedback received, rewrites", "Recorded oral presentations with self-evaluation", "Accountability memo on claims, evidence used, and limits of what the team can defend", "Final oral defense without notes"]
evaluation_primary_es = "WP, Portfolio escrito con historia de revisiones"
evaluation_primary_en = "WP, Written portfolio with revision history"
evaluation_secondaries_es = ["Presentaciones grabadas con autoevaluación"]
evaluation_secondaries_en = ["Recorded presentations with self-evaluation"]
evaluation_criteria_es = ["Claridad del argumento y trazabilidad de la evidencia", "Capacidad de reconocer incertidumbre y límites", "Responsabilidad por afirmaciones que afectan a terceros"]
evaluation_criteria_en = ["Clarity of argument and traceability of evidence", "Ability to recognize uncertainty and limits", "Responsibility for claims that affect others"]
references = ["Stanford PWR Program in Writing and Rhetoric", "MIT CI-H Communication Intensive", "Harvard Bok Center Writing Program"]

[[studio]]
number = 2
