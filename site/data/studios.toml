concrete_example_es = "Un sistema funcional de sensor más actuador que responde a una entrada física, por ejemplo un controlador de riego con sensores de humedad para una plaza pública, acompañado de un modelo de amenazas que documente al menos tres modos de falla y un postmortem escrito por el equipo que lo atacó."
concrete_example_en = "A working sensor + actuator system that responds to a physical input, for example a moisture-sensing irrigation controller for a public park, accompanied by a threat model documenting at least three failure modes and a postmortem written by the team that attacked it."
structure_es = "Equipos de 4 a 5 estudiantes. Un equipo construye y otro ataca. Los roles rotan en el punto medio. El componente físico es obligatorio: el sistema debe medir, mover o interactuar con algo tangible. La IA asiste a ambos lados."
structure_en = "Teams of 4-5 students. One team builds, another attacks. Roles rotate at the midpoint. The physical component is mandatory: the system must measure, move, or interact with something tangible. AI assists both sides."
deliverables_es = ["Documento de especificación", "Plan de pruebas", "Prototipo funcional con componente físico", "Bitácora de mediciones", "Modelo de amenazas", "Reporte de incidente", "Reporte de falla", "Postmortem y retrospectiva de equipo"]
deliverables_en = ["Specification document", "Test plan", "Functional prototype with physical component", "Measurement log", "Threat model", "Incident report", "Failure report", "Postmortem and team retrospective"]
evaluation_primary_es = "PD, Defensa pública de un sistema funcional"
evaluation_primary_en = "PD, Public defense of functional system"
evaluation_secondaries_es = []
evaluation_secondaries_en = []
evaluation_criteria_es = ["Correspondencia entre especificación, pruebas y comportamiento observado", "Calidad de medición e instrumentación", "Tratamiento explícito de modos de falla, usuarios afectados y riesgos físicos"]
evaluation_criteria_en = ["Match between specification, tests, and observed behavior", "Quality of measurement and instrumentation", "Explicit treatment of failure modes, affected users, and physical risks"]
references = ["MIT 6.S08 Interconnected Embedded Systems", "Caltech ME/EE 75 Projects in Experimental Engineering", "UCL Integrated Engineering Programme"]

