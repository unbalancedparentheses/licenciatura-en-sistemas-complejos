[[studio]]
number = 6
slug = "venture-from-zero"
year = 3
blocks = ["C", "D"]
number_text = "Studio VI, Año 3, Bloques C+D + Año 4"
roman = "VI"
title_es = "Venture from Zero"
title_en = "Venture from Zero"
objective_es = "Crear una empresa real durante 16 semanas, bajo restricciones legales, financieras, organizacionales y regulatorias genuinas. No es una simulación. Los equipos constituyen legalmente una sociedad, construyen un MVP, buscan clientes reales, venden o demuestran demanda verificable, cobran cuando corresponde, miden, iteran y rinden cuentas por las decisiones tomadas. La justificación pedagógica no es la cultura startup sino la prueba integrada de operar bajo restricciones reales."
objective_en = "Create a real company over 16 weeks, under genuine legal, financial, organizational, and regulatory constraints. This is not a simulation. Teams legally incorporate a company, build an MVP, find real customers, sell or demonstrate verifiable demand, get paid where appropriate, measure, iterate, and account for the decisions they made. The pedagogical justification is not startup culture but the integrated test of operating under real constraints."
concrete_example_es = "Una sociedad legalmente constituida con un MVP funcional, entrevistas y evidencia de demanda real, primeros clientes o pilotos, modelo financiero, cap table inicial, registro escrito de decisiones y un pitch defendido ante un panel con inversores, emprendedores y revisores técnicos."
concrete_example_en = "A legally incorporated company with a functional MVP, interviews and evidence of real demand, first customers or pilots, financial model, initial cap table, written decision log, and a pitch defended before a panel including investors, entrepreneurs, and technical reviewers."
structure_es = "Las primeras semanas cubren mecánicas operativas de creación de empresas: constitución legal, cap table, fundraising, primeros clientes, contabilidad básica, compliance e impuestos. No se enseñan en abstracto: se ejecutan inmediatamente como parte del lanzamiento del venture. El Studio integra todo lo aprendido en tres años: habilidades técnicas, diseño, instituciones, finanzas, comunicación y liderazgo."
structure_en = "The first weeks cover the operational mechanics of company creation: incorporation, cap table, fundraising, first customers, basic accounting, compliance, taxes. These are not taught in the abstract: they are executed immediately as part of launching the venture. The Studio integrates everything learned in three years: technical skills, design, institutions, finance, communication, and leadership."
deliverables_es = ["Empresa constituida o en proceso de constitución", "MVP funcional", "Evidencia de demanda real: clientes que pagan, pilotos, cartas de intención o uso documentado", "Modelo financiero actualizado, cap table inicial y registro documentado de decisiones", "Checklist operativo: contabilidad, compliance, impuestos, soporte y responsabilidades", "Registro de riesgos legales, financieros, técnicos y reputacionales", "Reporte de uso de IA", "Reporte de red team por pares", "Postmortem completo", "Defensa pública final ante revisores técnicos, institucionales, emprendedores e inversores"]
