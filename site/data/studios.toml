[[studio]]
number = 6
slug = "venture-from-zero"
year = 3
blocks = ["C", "D"]
number_text = "Studio VI, Año 3, Bloques C+D + Año 3.5"
roman = "VI"
title_es = "Venture from Zero"
title_en = "Venture from Zero"
objective_es = "Lanzar y operar una organización real durante 16 semanas, bajo restricciones legales, financieras, organizacionales y regulatorias genuinas. No es una simulación. La forma concreta de la organización es deliberadamente amplia: una startup tecnológica, una cooperativa, un producto cívico (una herramienta open-source al servicio de un propósito público), una organización de interés público (ONG, fundación, empresa social) o un prototipo institucional (una pieza de infraestructura institucional que pueda convertirse en una institución real). Lo no negociable es operar bajo restricciones reales, no adoptar un modelo particular de organización. Cualquiera sea la forma, los equipos constituyen legalmente, construyen lo que tengan que construir, encuentran a su audiencia o sus contrapartes reales, y rinden cuentas por lo que hicieron."
objective_en = "Launch and operate a real organization over 16 weeks, under genuine legal, financial, organizational, and regulatory constraints. This is not a simulation. The concrete form of the organization is deliberately broad: a startup (technology company), a cooperative, a civic product (an open-source tool serving a public purpose), a public-interest organization (NGO, foundation, social enterprise), or an institutional prototype (a piece of institutional infrastructure that could become a real institution). What is non-negotiable is operating under real constraints, not adopting a particular model of what an organization looks like. Whatever the form, teams legally constitute it, build whatever has to be built, find their real audience or counterparties, and are accountable for what they did."
concrete_example_es = "Una organización legalmente constituida con operaciones documentadas y una audiencia real, podría ser una startup con clientes que pagan, una cooperativa con socios e ingresos, un producto cívico con uso documentado o una organización de interés público con un lanzamiento formal y actores involucrados; la defensa de Studio VI incluye un modelo financiero y un registro escrito de decisiones."
concrete_example_en = "A legally-constituted organization with documented operations and a real audience, this could be a startup with paying customers, a cooperative with members and revenue, a civic product with documented usage, or a public-interest organization with a formal launch and stakeholders; the Studio VI defense includes a financial model and a documented decision log."
structure_es = "Las primeras semanas cubren mecánicas operativas comunes a cualquier forma organizacional viable: constitución legal en la figura jurídica adecuada (sociedad, cooperativa, asociación civil, fundación), gobernanza interna y mesa de socios o miembros, financiamiento (capital de riesgo, capital propio, subsidios públicos, donaciones, ingresos por servicios o membresías según corresponda), primeras contrapartes reales (clientes, miembros, usuarios, beneficiarios), contabilidad básica, compliance e impuestos. No se enseñan en abstracto: se ejecutan inmediatamente como parte del lanzamiento. El Studio integra todo lo aprendido en tres años: habilidades técnicas, diseño, instituciones, finanzas, comunicación y liderazgo."
structure_en = "The first weeks cover operational mechanics common to any viable organizational form: legal constitution in the appropriate legal vehicle (corporation, cooperative, civil association, foundation), internal governance and shareholder/member structure, funding (venture capital, founder capital, public grants, donations, service or membership revenue, as appropriate), first real counterparties (customers, members, users, beneficiaries), basic accounting, compliance, taxes. These are not taught in the abstract: they are executed immediately as part of launching the organization. The Studio integrates everything learned in three years: technical skills, design, institutions, finance, communication, and leadership."
deliverables_es = ["Organización constituida o en proceso de constitución (en la figura legal apropiada: empresa, cooperativa, asociación civil, fundación u otra)", "Producto, servicio o pieza de infraestructura institucional funcional", "Evidencia de operación con la audiencia real correspondiente (clientes que pagan, socios cooperativos, usuarios documentados, beneficiarios o contrapartes institucionales)", "Modelo financiero actualizado y registro de decisiones documentado", "Reporte de uso de IA", "Reporte de red team por pares", "Postmortem completo", "Defensa pública final ante revisores técnicos, institucionales e industriales"]
deliverables_en = ["Constituted organization (or in process) in the appropriate legal form (company, cooperative, civil association, foundation, or other)", "Functional product, service, or piece of institutional infrastructure", "Evidence of operation with the corresponding real audience (paying customers, cooperative members, documented users, beneficiaries, or institutional counterparties)", "Updated financial model and documented decision log", "AI usage report", "Red team report by peers", "Complete postmortem", "Final public defense before technical, institutional, and industry reviewers"]
evaluation_primary_es = "PD, Defensa pública final ante un panel que reúne las contrapartes apropiadas a la forma organizacional elegida (inversores, miembros cooperativos, contrapartes institucionales o reguladoras, o una combinación)"
evaluation_primary_en = "PD, Final public defense before a panel assembling the counterparties appropriate to the chosen organizational form (investors, cooperative members, institutional or regulatory counterparties, or some combination)"
evaluation_secondaries_es = []
evaluation_secondaries_en = []
references = ["Y Combinator Startup School", "Stanford CS 183 Startup", "MIT delta v accelerator", "Entrepreneur First"]
