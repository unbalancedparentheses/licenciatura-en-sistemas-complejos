title_en = "Decision and Operation under Uncertainty"
objective_es = "Operar sistemas técnicos, organizacionales e institucionales en situaciones simuladas de alta presión: diagnosticar rápido, priorizar, coordinar, comunicar y decidir con información incompleta, y rendir cuentas por lo decidido."
objective_en = "Operate technical, organizational, and institutional systems in simulated high-pressure situations: diagnose quickly, prioritize, coordinate, communicate, and decide with incomplete information, and account for what was decided."
content_es = "Simulación de situaciones de alta presión en sistemas técnicos, organizacionales e institucionales. Diagnóstico rápido, priorización, coordinación de equipos, comunicación en crisis, toma de decisiones con información incompleta, manejo de errores, escalamiento, recuperación y rendición de cuentas. Incidentes técnicos, fallas operativas, conflictos entre actores, presión de tiempo y consecuencias públicas. Postmortems, aprendizaje institucional y mejora de procesos."
content_en = "Simulation of high-pressure situations in technical, organizational, and institutional systems. Rapid diagnosis, prioritization, team coordination, crisis communication, decision-making with incomplete information, error handling, escalation, recovery, and accountability. Technical incidents, operational failures, conflicts between actors, time pressure, and public consequences. Postmortems, institutional learning, and process improvement."
concrete_example_es = "Un servicio monitoreado que corre durante el cuatrimestre bajo carga simulada, con objetivos de servicio explícitos y guardias rotativas, sobre el que se escenifican al menos dos crisis: un incidente técnico y un conflicto entre actores con consecuencias públicas, cada uno con su postmortem escrito."
concrete_example_en = "A monitored service running through the cuatrimestre under simulated load, with explicit service objectives and rotating on-call shifts, on which at least two crises are staged: a technical incident and a conflict between actors with public consequences, each with its written postmortem."
structure_es = "Las crisis se escenifican sin aviso previo. Cada equipo rota por roles de operación, coordinación y comunicación pública. La probabilidad y los sistemas dinámicos que se cursan en simultáneo dan el lenguaje para razonar sobre riesgo y estabilidad."
structure_en = "Crises are staged without prior notice. Each team rotates through operation, coordination, and public-communication roles. The probability and dynamical systems taken simultaneously provide the language to reason about risk and stability."
deliverables_es = ["Objetivos de servicio y plan de monitoreo", "Registros de incidentes y de decisiones", "Comunicaciones de crisis a usuarios y actores afectados", "Postmortems", "Retrospectiva de coordinación de equipo"]
deliverables_en = ["Service objectives and monitoring plan", "Incident and decision logs", "Crisis communications to affected users and actors", "Postmortems", "Team coordination retrospective"]
evaluation_primary_es = "PD, Defensa simulando una revisión post-incidente"
evaluation_primary_en = "PD, Defense simulating a post-incident review"
evaluation_secondaries_es = []
evaluation_secondaries_en = []
evaluation_criteria_es = ["Calidad del diagnóstico y de la priorización bajo presión", "Calidad de la comunicación con usuarios y actores afectados", "Honestidad del postmortem y medidas preventivas"]
evaluation_criteria_en = ["Quality of diagnosis and prioritization under pressure", "Quality of communication with affected users and actors", "Honesty of the postmortem and preventive measures"]
