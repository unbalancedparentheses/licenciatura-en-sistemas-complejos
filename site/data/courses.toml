content_en = "Markov chains, random walks, Poisson processes, Brownian motion. Fat-tailed distributions, the ergodicity problem, Kelly criterion, Black Swan dynamics. The second half treats fat tails as the central argument, not an appendix."
notes_html = "The integration of fat tails is not an appendix — it is the central argument of the second half of the course. Connects directly with Biology (ecological collapse is a fat-tailed event), Physics (thermodynamics of far-from-equilibrium systems), and Epistemology (the problem of induction is Taleb's central philosophical concern)."
texts = [
