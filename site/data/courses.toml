[[course]]
slug = "control-observabilidad-y-medicion"
title_es = "Control, Observabilidad y Medición"
title_en = "Control, Observability and Measurement"
year = 3
block = "A"
position = 2
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender feedback, estabilidad y observabilidad — y qué le hace la medición a las cosas que mide. La materia que une control de sistemas con la epistemología y la política de las métricas."
objective_en = "To understand feedback, stability, and observability — and what measurement does to the things it measures. The course that fuses systems control with the epistemology and politics of metrics."
content_es = "Teoría de control, análisis de estabilidad, diseño de controladores. Observabilidad: qué se puede y no se puede medir. Ley de Goodhart y ley de Campbell — cuándo una métrica deja de medir lo que dice medir. La política de las métricas: incentivos perversos, gaming, captura. La diferencia entre medir y gestionar. Epistemología de los indicadores: qué construye una medición sobre el sistema medido. Resiliencia: degradación grácil, recuperación, blast radius."
content_en = "Control theory, stability analysis, controller design. Observability: what can and cannot be measured. Goodhart's law and Campbell's law — when a metric stops measuring what it claims to. The politics of metrics: perverse incentives, gaming, capture. The difference between measuring and managing. Epistemology of indicators: what a measurement constructs about the system measured. Resilience: graceful degradation, recovery, blast radius."
texts = [
  "Åström, Karl J., and Richard M. Murray. <em>Feedback Systems.</em> Princeton University Press, 2008.",
  "Leveson, Nancy G. <em>Engineering a Safer World.</em> MIT Press, 2011.",
  "Meadows, Donella H. <em>Thinking in Systems.</em> Chelsea Green, 2008.",
  "Porter, Theodore M. <em>Trust in Numbers: The Pursuit of Objectivity in Science and Public Life.</em> Princeton University Press, 1995. The historical construction of quantification as authority.",
  "Muller, Jerry Z. <em>The Tyranny of Metrics.</em> Princeton University Press, 2018. Why measurement-driven management systematically distorts what it claims to optimize.",
  "Espeland, Wendy Nelson, and Mitchell L. Stevens. \"Commensuration as a Social Process.\" <em>Annual Review of Sociology,</em> 1998. How making things commensurable is itself a political act.",
  "Goodhart, Charles. \"Problems of Monetary Management\" (1975) and Strathern's later restatement: <em>\"When a measure becomes a target, it ceases to be a good measure.\"</em>",
]
references = [
  { name = "Stanford EE 263 Linear Dynamical Systems", url = "" },
  { name = "MIT 6.3100 Dynamical Systems and Control", url = "https://ocw.mit.edu" },
  { name = "Caltech CDS 110 Introduction to Control", url = "" },
]
evaluation_primary = "WE — Written exam"
evaluation_secondary = "OD — Defense of system stability analysis"

