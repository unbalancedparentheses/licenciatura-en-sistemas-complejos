[[course]]
slug = "cultura-legitimidad-y-normas"
title_es = "Cultura, Legitimidad y Normas"
title_en = "Culture, Legitimacy and Norms"
year = 3.5
block = "A"
position = 2
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender las estructuras no formales que sostienen a los sistemas, o los desgarran. La cultura popular es donde una sociedad procesa sus ansiedades sobre el futuro."
objective_en = "To understand the informal structures that sustain systems, or tear them apart. Popular culture is where a society processes its anxieties about the future."
content_es = "Análisis de cómo las normas culturales, las pretensiones de legitimidad y las expectativas sociales moldean el comportamiento institucional. Incluye canon de anime y ciencia ficción tratados como material primario de análisis: Neon Genesis Evangelion, Ghost in the Shell, Foundation, Neuromancer."
content_en = "Analysis of how cultural norms, legitimacy claims, and social expectations shape institutional behavior. Includes anime and science fiction canon treated as primary analytical material: Neon Genesis Evangelion, Ghost in the Shell, Foundation, Neuromancer."
notes_html_es = "Estas obras no son entretenimiento: son artefactos culturales que articulan las tensiones entre tecnología, instituciones, identidad y poder de un modo que los papers académicos no logran. La IA escribe análisis culturales convincentes pero superficiales, los estudiantes exponen los supuestos faltantes y conectan las narrativas culturales con la estabilidad sistémica."
notes_html_en = "These works are not entertainment: they are cultural artifacts that articulate the tensions between technology, institutions, identity, and power in ways academic papers cannot. AI writes convincing-but-shallow cultural analyses, students expose missing assumptions and connect cultural narratives to systemic stability."
texts = [
  "Douglas, Mary. <em>How Institutions Think.</em> Syracuse University Press, 1986.",
  "Bourdieu, Pierre. <em>The Logic of Practice.</em> Stanford University Press, 1990.",
  "Henrich, Joseph. <em>The WEIRDest People in the World.</em> Farrar, Straus and Giroux, 2020.",
  { citation = "Fisher, Mark. <em>Ghosts of My Life.</em> Zero Books, 2014.", note_es = "Hauntología, la cultura como repetición de futuros cancelados; el marco teórico para analizar por qué seguimos procesando las mismas ansiedades tecnológicas.", note_en = "Hauntology, culture as the repetition of cancelled futures; the theoretical frame for analyzing why we keep processing the same technological anxieties." },
  { citation = "Han, Byung-Chul. <em>The Burnout Society</em> and <em>Psychopolitics.</em> Stanford University Press, 2015 / Verso, 2017.", note_es = "El control ya no es disciplinario sino que opera a través de la autoexplotación y el rendimiento; los estudiantes lo van a vivir.", note_en = "Control is no longer disciplinary but operates through self-exploitation and performance, students will live this." },
  { citation = "Girard, René. <em>Violence and the Sacred.</em> Johns Hopkins University Press, 1977.", note_es = "Mímesis, chivos expiatorios, la violencia fundante de toda cultura; explica las dinámicas de las redes sociales y la formación de consensos mejor que cualquier sociólogo contemporáneo.", note_en = "Mimesis, scapegoats, the founding violence of every culture, explains social media dynamics and consensus formation better than any contemporary sociologist." },
  { citation = "Illich, Ivan. <em>Tools for Conviviality.</em> Harper & Row, 1973.", note_es = "Las instituciones se vuelven contraproducentes pasado cierto umbral; meta-relevante: los estudiantes están en un programa educativo que debería hacerse esta pregunta.", note_en = "Institutions become counterproductive past a certain threshold, meta-relevant: students are in an educational program that should ask itself this question." },
  { citation = "Debord, Guy. <em>The Society of the Spectacle.</em> Zone Books, 1994.", note_es = "La mediación total de la experiencia por las imágenes, escrita en 1967, describe el 2025 mejor que cualquier análisis contemporáneo.", note_en = "The total mediation of experience by images, written in 1967, describes 2025 better than any contemporary analysis." },
  { citation = "Weber, Max. <em>The Protestant Ethic and the Spirit of Capitalism.</em> 1905.", note_es = "Cómo las ideas religiosas dieron forma al comportamiento económico, fundacional para entender las bases culturales del capitalismo moderno.", note_en = "How religious ideas shaped economic behavior, foundational for understanding the cultural bases of modern capitalism." },
  { citation = "Siedentop, Larry. <em>Inventing the Individual.</em> Belknap Press, 2014.", note_es = "Genealogía del individualismo occidental desde el cristianismo temprano, contexto imprescindible para los debates sobre conciencia, subjetividad y autonomía.", note_en = "Genealogy of Western individualism from early Christianity, essential context for debates on consciousness, subjectivity, and autonomy." },
  { citation = "O'Neil, Cathy. <em>Weapons of Math Destruction.</em> Crown, 2016.", note_es = "Cómo los algoritmos codifican y amplifican la desigualdad, la cultura de la opacidad algorítmica.", note_en = "How algorithms encode and amplify inequality, the culture of algorithmic opacity." },
  { citation = "Zuboff, Shoshana. <em>The Age of Surveillance Capitalism.</em> PublicAffairs, 2019.", note_es = "La extracción de datos conductuales como nueva forma de acumulación de capital, la cultura de la vigilancia normalizada.", note_en = "The extraction of behavioral data as a new form of capital accumulation, the culture of normalized surveillance." },
]
references = [
  { name = "Stanford Anthropology and Cultural Analysis", url = "https://anthropology.stanford.edu/" },
  { name = "MIT Comparative Media Studies", url = "https://cmsw.mit.edu/" },
  { name = "École Polytechnique HSS, Humanités et Sciences Sociales", url = "https://programmes.polytechnique.edu/cycle-ingenieur-polytechnicien/cycle-ingenieur-polytechnicien-program/academics" },
  { name = "Cambridge Social Anthropology", url = "https://www.socanth.cam.ac.uk/" },
]
evaluation_primary = "OD, Defense of critical essay connecting cultural artifact to institutional problem"
evaluation_secondaries = [
  "TP, Essay with full revision history",
]

[[course.extra_section]]
label_es = "Canon de análisis"
label_en = "Primary cultural canon"
html_es = """
<p><strong>Anime:</strong></p>
  <ul>
    <li><em>Neon Genesis Evangelion</em>, tecnología, instituciones disfuncionales (NERV), responsabilidad individual bajo presión institucional y límites del control humano sobre sistemas que no entendemos.</li>
    <li><em>Serial Experiments Lain</em>, identidad, realidad y disolución de la frontera entre lo digital y lo humano; filosofía de la mente disfrazada de anime.</li>
    <li><em>Ghost in the Shell</em>, conciencia en un mundo de cuerpos artificiales; conecta directamente con Epistemología y los Límites de la IA.</li>
    <li><em>Ergo Proxy</em>, sociedades post-colapso, gobernanza autoritaria y qué significa ser humano cuando las máquinas son conscientes.</li>
    <li><em>Akira</em>, tecnología, poder estatal y destrucción.</li>
  </ul>
  <p><strong>Ciencia ficción:</strong></p>
  <ul>
    <li>Asimov, <em>Foundation</em>, psicohistoria: ¿puede predecirse y diseñarse el comportamiento de sistemas complejos a escala social? Conecta directamente con Sistemas Complejos.</li>
    <li>Asimov, "The Last Question", entropía, información y límites de la computación.</li>
    <li>Gibson, <em>Neuromancer</em>, inventó el concepto de ciberespacio; define la estética de la relación humano-máquina.</li>
    <li>Dick, <em>Do Androids Dream of Electric Sheep?</em> / <em>Blade Runner</em>, la empatía como prueba de humanidad.</li>
    <li><em>Black Mirror</em> (episodios seleccionados), consecuencias no intencionales de la tecnología.</li>
    <li><em>The Matrix</em>, simulación, realidad y la Habitación China convertida en cine.</li>
  </ul>
"""
html_en = """
<p><strong>Anime:</strong></p>
  <ul>
    <li><em>Neon Genesis Evangelion</em>, technology, dysfunctional institutions (NERV), individual responsibility under institutional pressure, the limits of human control over systems we don't understand.</li>
    <li><em>Serial Experiments Lain</em>, identity, reality, and the dissolution of the boundary between the digital and the human; philosophy of mind disguised as anime.</li>
    <li><em>Ghost in the Shell</em>, consciousness in a world of artificial bodies; connects directly with Epistemología and the Limits of AI.</li>
    <li><em>Ergo Proxy</em>, post-collapse societies, authoritarian governance, what it means to be human when machines are conscious.</li>
    <li><em>Akira</em>, technology, state power, and destruction.</li>
  </ul>
  <p><strong>Science fiction:</strong></p>
  <ul>
    <li>Asimov, <em>Foundation</em>, psychohistory: can the behavior of complex systems be predicted and designed at societal scale? Connects directly with Sistemas Complejos.</li>
    <li>Asimov, "The Last Question", entropy, information, and the limits of computation.</li>
    <li>Gibson, <em>Neuromancer</em>, invented the concept of cyberspace; defines the aesthetic of the human-machine relationship.</li>
    <li>Dick, <em>Do Androids Dream of Electric Sheep?</em> / <em>Blade Runner</em>, empathy as a test of humanity.</li>
    <li><em>Black Mirror</em> (selected episodes), unintended consequences of technology.</li>
    <li><em>The Matrix</em>, simulation, reality, and the Chinese Room turned into film.</li>
  </ul>
"""

[[course]]
slug = "epistemologia-ciencia-y-los-limites-de-la-ia"
title_es = "Epistemología, Ciencia y los Límites de la IA"
title_en = "Epistemology, Science and the Limits of AI"
year = 2
block = "D"
position = 3
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender qué cuenta como conocimiento, qué hace válido a un modelo y qué pueden y no pueden hacer las máquinas. La materia que examina la afirmación fundacional del programa: que la AGI aún no puede ser confiada con el juicio."
objective_en = "To understand what counts as knowledge, what makes a model valid, and what machines can and cannot do. The course that examines the program's founding claim: that AI cannot yet be trusted with judgment."
content_es = "La materia se organiza en torno a tres preguntas: (1) ¿qué cuenta como conocimiento científico válido y cómo cambia esa pregunta a lo largo del tiempo? (2) ¿qué es la inteligencia, y qué la distingue, si algo la distingue, entre humanos y máquinas? (3) ¿qué oculta un modelo cuando explica algo, y cuándo la idealización deja de ser útil? El plan combina filosofía de la ciencia (falsabilidad, paradigmas, validez de modelos) con filosofía de la mente y la IA (la Habitación China, el problema del anclaje simbólico, el problema del alineamiento)."
content_en = "The course is organized around three questions: (1) what counts as valid scientific knowledge, and how does that question change over time? (2) what is intelligence, and what distinguishes it, if anything distinguishes it, between humans and machines? (3) what does a model hide when it explains something, and when does idealization stop being useful? The plan combines philosophy of science (falsifiability, paradigms, model validity) with philosophy of mind and AI (the Chinese Room, the symbol grounding problem, the alignment problem)."
notes_html_es = "La filosofía de la ciencia no es abstracta, es operativa para quienes construyen sistemas. La materia se ancla en cuatro lecturas centrales: Kuhn sobre cómo cambian los paradigmas, el debate Dreyfus–Dennett sobre qué es la inteligencia, Cartwright sobre la idealización en los modelos científicos, y Russell sobre el problema del alineamiento. Esos cuatro ejes estructuran el curso; los demás autores aparecen como ampliación o referencia, no como lectura paralela. Conecta directamente con Métodos Formales (Lakatos), Machine Learning (Cartwright sobre modelos) y Sistemas Complejos (Polanyi sobre conocimiento tácito)."
notes_html_en = "Philosophy of science is not abstract, it is operational for those who build systems. The course anchors on four core readings: Kuhn on how paradigms change, the Dreyfus–Dennett debate on what intelligence is, Cartwright on idealization in scientific models, and Russell on the alignment problem. Those four are the structural spine of the course; other authors appear as extensions or references, not as parallel reading. Connects directly with Métodos Formales (Lakatos), Machine Learning (Cartwright on models), and Sistemas Complejos (Polanyi on tacit knowledge)."
texts = [
  "Kuhn, Thomas S. <em>The Structure of Scientific Revolutions.</em> 4th ed. University of Chicago Press, 2012.",
  { citation = "Dreyfus, Hubert L. <em>What Computers Can't Do.</em> Harper & Row, 1972.", note_es = "Lectura central. La crítica fenomenológica más potente de la IA; tuvo razón sobre la GOFAI y sus argumentos sobre la corporalidad siguen sin resolución por parte de los LLMs.", note_en = "Core reading. The most powerful phenomenological critique of AI, was right about GOFAI, his arguments about embodiment remain unresolved by LLMs." },
  { citation = "Dennett, Daniel C. <em>Consciousness Explained.</em> Little, Brown, 1991.", note_es = "Lectura central. La posición funcionalista / deflacionaria, contrapunto directo a Dreyfus; el debate Dreyfus–Dennett es el eje central de la filosofía de la IA.", note_en = "Core reading. The functionalist / deflationary position, direct counterpoint to Dreyfus; the Dreyfus–Dennett debate is the central axis of philosophy of AI." },
  { citation = "Cartwright, Nancy. <em>How the Laws of Physics Lie.</em> Oxford University Press, 1983.", note_es = "Lectura central. Los modelos idealizan, no describen; lectura clave para quienes construyen modelos de ML.", note_en = "Core reading. Models idealize, they don't describe, crucial for ML builders." },
  { citation = "Russell, Stuart. <em>Human Compatible.</em> Viking, 2019.", note_es = "Lectura central. El problema del alineamiento por uno de los fundadores del campo: por qué las máquinas que optimizan objetivos mal especificados son peligrosas.", note_en = "Core reading. The alignment problem from a founder of the field, why machines optimizing misspecified objectives are dangerous." },
]
references = [
  { name = "Stanford Symbolic Systems Program", url = "https://symsys.stanford.edu/" },
  { name = "Stanford Phil 80 Mind, Matter, and Meaning", url = "https://explorecourses.stanford.edu/search?q=PHIL+80" },
  { name = "MIT 24.09 Minds and Machines", url = "https://ocw.mit.edu/courses/24-09-minds-and-machines-fall-2011/" },
  { name = "Oxford Philosophy of Mind", url = "https://www.philosophy.ox.ac.uk/" },
  { name = "Cambridge HPS", url = "https://www.hps.cam.ac.uk/" },
]
evaluation_primary = "OD, Defense of philosophical analysis of a real AI system"
evaluation_secondaries = [
  "TP, Written analysis",
]

