content_en = "Static and dynamic games. Nash equilibrium. Repeated games, cooperation, coordination, and commitment. Incomplete information and signaling. Auctions, matching, voting, market design, and incentives. Incentive-compatible mechanisms. Applications to platforms, institutions, regulation, and public policy."
