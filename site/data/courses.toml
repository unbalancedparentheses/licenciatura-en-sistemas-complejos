  { name = "MIT 6.C571 Optimization Methods", url = "https://optimization.mit.edu/classes/" },
  { name = "MIT 15.053 Optimization Methods in Management Science", url = "https://ocw.mit.edu/courses/15-053-optimization-methods-in-management-science-spring-2013/" },
]
