[[course]]
slug = "cultura-legitimidad-e-instituciones-informales"
title_es = "Cultura, Legitimidad e Instituciones Informales"
title_en = "Culture, Legitimacy, and Informal Institutions"
cuatrimestre = 8
position = 3
hours = [0, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender las estructuras no formales que sostienen a los sistemas, o los desgarran. La cultura popular es donde una sociedad procesa sus ansiedades sobre el futuro."
objective_en = "To understand the informal structures that sustain systems, or tear them apart. Popular culture is where a society processes its anxieties about the future."
content_es = "Cultura, normas sociales, autoridad, legitimidad y obediencia. Formación de sentido, confianza pública, reputación, rituales, símbolos e instituciones informales. Conflicto cultural y cambio normativo. Legitimidad de sistemas técnicos e institucionales. Relación entre eficacia, aceptación social y responsabilidad pública."
content_en = "Culture, social norms, authority, legitimacy, and obedience. Sense-making, public trust, reputation, rituals, symbols, and informal institutions. Cultural conflict and normative change. Legitimacy of technical and institutional systems. The relationship between effectiveness, social acceptance, and public responsibility."
notes_html_es = "Estas obras no son entretenimiento: son artefactos culturales que articulan las tensiones entre tecnología, instituciones, identidad y poder de un modo que los papers académicos no logran. La IA escribe análisis culturales convincentes pero superficiales, los estudiantes exponen los supuestos faltantes y conectan las narrativas culturales con la estabilidad sistémica."
notes_html_en = "These works are not entertainment: they are cultural artifacts that articulate the tensions between technology, institutions, identity, and power in ways academic papers cannot. AI writes convincing-but-shallow cultural analyses, students expose missing assumptions and connect cultural narratives to systemic stability."
texts = [
  "Douglas, Mary. <em>How Institutions Think.</em> Syracuse University Press, 1986.",
  "Bourdieu, Pierre. <em>The Logic of Practice.</em> Stanford University Press, 1990.",
  "Henrich, Joseph. <em>The WEIRDest People in the World.</em> Farrar, Straus and Giroux, 2020.",
  { citation = "Fisher, Mark. <em>Ghosts of My Life.</em> Zero Books, 2014.", note_es = "Hauntología, la cultura como repetición de futuros cancelados; el marco teórico para analizar por qué seguimos procesando las mismas ansiedades tecnológicas.", note_en = "Hauntology, culture as the repetition of cancelled futures; the theoretical frame for analyzing why we keep processing the same technological anxieties." },
  { citation = "Han, Byung-Chul. <em>The Burnout Society</em> and <em>Psychopolitics.</em> Stanford University Press, 2015 / Verso, 2017.", note_es = "El control ya no es disciplinario sino que opera a través de la autoexplotación y el rendimiento; los estudiantes lo van a vivir.", note_en = "Control is no longer disciplinary but operates through self-exploitation and performance, students will live this." },
  { citation = "Girard, René. <em>Violence and the Sacred.</em> Johns Hopkins University Press, 1977.", note_es = "Mímesis, chivos expiatorios, la violencia fundante de toda cultura; explica las dinámicas de las redes sociales y la formación de consensos mejor que cualquier sociólogo contemporáneo.", note_en = "Mimesis, scapegoats, the founding violence of every culture, explains social media dynamics and consensus formation better than any contemporary sociologist." },
  { citation = "Illich, Ivan. <em>Tools for Conviviality.</em> Harper & Row, 1973.", note_es = "Las instituciones se vuelven contraproducentes pasado cierto umbral; meta-relevante: los estudiantes están en un programa educativo que debería hacerse esta pregunta.", note_en = "Institutions become counterproductive past a certain threshold, meta-relevant: students are in an educational program that should ask itself this question." },
  { citation = "Debord, Guy. <em>The Society of the Spectacle.</em> Zone Books, 1994.", note_es = "La mediación total de la experiencia por las imágenes, escrita en 1967, describe el 2025 mejor que cualquier análisis contemporáneo.", note_en = "The total mediation of experience by images, written in 1967, describes 2025 better than any contemporary analysis." },
  { citation = "Weber, Max. <em>The Protestant Ethic and the Spirit of Capitalism.</em> 1905.", note_es = "Cómo las ideas religiosas dieron forma al comportamiento económico, fundacional para entender las bases culturales del capitalismo moderno.", note_en = "How religious ideas shaped economic behavior, foundational for understanding the cultural bases of modern capitalism." },
  { citation = "Siedentop, Larry. <em>Inventing the Individual.</em> Belknap Press, 2014.", note_es = "Genealogía del individualismo occidental desde el cristianismo temprano, contexto imprescindible para los debates sobre conciencia, subjetividad y autonomía.", note_en = "Genealogy of Western individualism from early Christianity, essential context for debates on consciousness, subjectivity, and autonomy." },
  { citation = "O'Neil, Cathy. <em>Weapons of Math Destruction.</em> Crown, 2016.", note_es = "Cómo los algoritmos codifican y amplifican la desigualdad, la cultura de la opacidad algorítmica.", note_en = "How algorithms encode and amplify inequality, the culture of algorithmic opacity." },
  { citation = "Zuboff, Shoshana. <em>The Age of Surveillance Capitalism.</em> PublicAffairs, 2019.", note_es = "La extracción de datos conductuales como nueva forma de acumulación de capital, la cultura de la vigilancia normalizada.", note_en = "The extraction of behavioral data as a new form of capital accumulation, the culture of normalized surveillance." },
]
references = [
  { name = "Stanford Anthropology and Cultural Analysis", url = "https://anthropology.stanford.edu/" },
  { name = "MIT Comparative Media Studies", url = "https://cmsw.mit.edu/" },
  { name = "École Polytechnique HSS, Humanités et Sciences Sociales", url = "https://programmes.polytechnique.edu/cycle-ingenieur-polytechnicien/cycle-ingenieur-polytechnicien-program/academics" },
  { name = "Cambridge Social Anthropology", url = "https://www.socanth.cam.ac.uk/" },
]
evaluation_primary = "OD, Defense of critical essay connecting cultural artifact to institutional problem"
evaluation_secondaries = [
  "TP, Essay with full revision history",
]

[[course.extra_section]]
label_es = "Canon de análisis"
label_en = "Primary cultural canon"
html_es = "<p><strong>Anime:</strong></p>\n  <ul>\n    <li><em>Neon Genesis Evangelion</em>, tecnología, instituciones disfuncionales (NERV), responsabilidad individual bajo presión institucional y límites del control humano sobre sistemas que no entendemos.</li>\n    <li><em>Serial Experiments Lain</em>, identidad, realidad y disolución de la frontera entre lo digital y lo humano; filosofía de la mente disfrazada de anime.</li>\n    <li><em>Ghost in the Shell</em>, conciencia en un mundo de cuerpos artificiales; conecta directamente con Epistemología, Ética y los límites de la IA.</li>\n    <li><em>Ergo Proxy</em>, sociedades post-colapso, gobernanza autoritaria y qué significa ser humano cuando las máquinas son conscientes.</li>\n    <li><em>Akira</em>, tecnología, poder estatal y destrucción.</li>\n  </ul>\n  <p><strong>Ciencia ficción:</strong></p>\n  <ul>\n    <li>Asimov, <em>Foundation</em>, psicohistoria: ¿puede predecirse y diseñarse el comportamiento de sistemas complejos a escala social? Conecta directamente con Sistemas Complejos.</li>\n    <li>Asimov, \"The Last Question\", entropía, información y límites de la computación.</li>\n    <li>Gibson, <em>Neuromancer</em>, inventó el concepto de ciberespacio; define la estética de la relación humano-máquina.</li>\n    <li>Dick, <em>Do Androids Dream of Electric Sheep?</em> / <em>Blade Runner</em>, la empatía como prueba de humanidad.</li>\n    <li><em>Black Mirror</em> (episodios seleccionados), consecuencias no intencionales de la tecnología.</li>\n    <li><em>The Matrix</em>, simulación, realidad y la Habitación China convertida en cine.</li>\n  </ul>\n"
html_en = "<p><strong>Anime:</strong></p>\n  <ul>\n    <li><em>Neon Genesis Evangelion</em>, technology, dysfunctional institutions (NERV), individual responsibility under institutional pressure, the limits of human control over systems we don't understand.</li>\n    <li><em>Serial Experiments Lain</em>, identity, reality, and the dissolution of the boundary between the digital and the human; philosophy of mind disguised as anime.</li>\n    <li><em>Ghost in the Shell</em>, consciousness in a world of artificial bodies; connects directly with Epistemology, Ethics, and the Limits of AI.</li>\n    <li><em>Ergo Proxy</em>, post-collapse societies, authoritarian governance, what it means to be human when machines are conscious.</li>\n    <li><em>Akira</em>, technology, state power, and destruction.</li>\n  </ul>\n  <p><strong>Science fiction:</strong></p>\n  <ul>\n    <li>Asimov, <em>Foundation</em>, psychohistory: can the behavior of complex systems be predicted and designed at societal scale? Connects directly with Sistemas Complejos.</li>\n    <li>Asimov, \"The Last Question\", entropy, information, and the limits of computation.</li>\n    <li>Gibson, <em>Neuromancer</em>, invented the concept of cyberspace; defines the aesthetic of the human-machine relationship.</li>\n    <li>Dick, <em>Do Androids Dream of Electric Sheep?</em> / <em>Blade Runner</em>, empathy as a test of humanity.</li>\n    <li><em>Black Mirror</em> (selected episodes), unintended consequences of technology.</li>\n    <li><em>The Matrix</em>, simulation, reality, and the Chinese Room turned into film.</li>\n  </ul>\n"
