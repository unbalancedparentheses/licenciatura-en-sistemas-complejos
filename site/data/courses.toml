[[course]]
slug = "algebra-lineal-y-computacion-ii"
title_es = "Álgebra Lineal y Computación II"
title_en = "Linear Algebra and Computation II"
cuatrimestre = 2
position = 1
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Del álgebra lineal a la optimización y el aprendizaje. La materia donde la matemática se conecta con el análisis de datos, el machine learning y los sistemas dinámicos."
objective_en = "From linear algebra to optimization and learning. The course where mathematics connects with data analysis, machine learning, and dynamical systems."
content_es = "Autovalores y autovectores. Diagonalización. Descomposición en valores singulares. Mínimos cuadrados. Condicionamiento y estabilidad numérica. Matrices en datos, redes, reducción de dimensión, gráficos, aprendizaje automático y sistemas dinámicos."
content_en = "Eigenvalues and eigenvectors. Diagonalization. Singular value decomposition. Least squares. Conditioning and numerical stability. Matrices in data, networks, dimensionality reduction, graphics, machine learning, and dynamical systems."
texts = [
  "Strang, Gilbert. <em>Linear Algebra and Learning from Data.</em> Parts II–IV. Wellesley-Cambridge Press, 2019.",
  "Boyd, Stephen, and Lieven Vandenberghe. <em>Convex Optimization.</em> Cambridge University Press, 2004.",
]
references = [
  { name = "MIT 18.065 Matrix Methods in Data Analysis", url = "https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/" },
  { name = "Stanford EE364A Convex Optimization", url = "https://stanford.edu/class/ee364a" },
]
evaluation_primary = "WE, Written Exam"
evaluation_secondaries = [
  "TP, Computational project",
]

[[course]]
slug = "calculo-y-analisis-ii"
title_es = "Cálculo y Análisis II"
title_en = "Calculus and Analysis II"
cuatrimestre = 2
position = 2
hours = [6, 0]
audiences = ["students", "faculty", "authorities"]
objective_es = "Extender el cálculo a varias variables, el lenguaje del machine learning, la optimización y la física de campos. Construye sobre Cálculo y Análisis I y provee el cálculo vectorial que Física II, optimización y los gradientes del aprendizaje asumen. Es la segunda mitad de la secuencia Ma 1 de Caltech (18.02 del MIT)."
objective_en = "To extend calculus to several variables, the language of machine learning, optimization, and field physics. It builds on Cálculo y Análisis I and provides the vector calculus that Física II, optimization, and the gradients of learning assume. It is the second half of Caltech's Ma 1 sequence (MIT 18.02)."
content_es = "Funciones de varias variables. Derivadas parciales, gradiente, jacobiano y hessiano. Optimización con y sin restricciones. Multiplicadores de Lagrange. Integrales múltiples. Cambio de variables. Cálculo vectorial: campos, divergencia, rotor, Green y Stokes. Aplicaciones a física, optimización y aprendizaje automático."
content_en = "Functions of several variables. Partial derivatives, gradient, Jacobian, and Hessian. Constrained and unconstrained optimization. Lagrange multipliers. Multiple integrals. Change of variables. Vector calculus: fields, divergence, curl, Green and Stokes. Applications to physics, optimization, and machine learning."
notes_html_es = "Segunda de dos materias de cálculo. Provee a Física II (3.er cuatrimestre) el cálculo vectorial del electromagnetismo y a Machine Learning y Deep Learning el cálculo multivariable de los gradientes."
notes_html_en = "Second of two calculus courses. It gives Physics II (3rd cuatrimestre) the vector calculus of electromagnetism and gives Machine Learning and Deep Learning the multivariable calculus of gradients."
texts = [
  { citation = "Hubbard, John H., and Barbara Burke Hubbard. <em>Vector Calculus, Linear Algebra, and Differential Forms.</em> 5th ed. Matrix Editions, 2015.", note_es = "Cálculo en varias variables con álgebra lineal y formas diferenciales, el puente natural hacia ML, optimización y física.", note_en = "Multivariable calculus with linear algebra and differential forms, the natural bridge into ML, optimization, and physics." },
  { citation = "Apostol, Tom M. <em>Calculus.</em> Vol. II. 2nd ed. Wiley, 1967.", note_es = "Cálculo en varias variables tratado con el rigor del núcleo de Caltech.", note_en = "Multivariable calculus treated with the rigor of Caltech's core." },
]
references = [
  { name = "MIT 18.02 Multivariable Calculus", url = "https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/" },
  { name = "Caltech Ma 1abc Mathematics", url = "https://pma.caltech.edu/courses" },
]
evaluation_primary = "WE, Written exam with unseen problems"
evaluation_secondaries = [
  "TP, Weekly problem sets and a vector-calculus project",
]

[[course]]
slug = "fisica-i"
title_es = "Física I: Mecánica, Energía y Termodinámica"
title_en = "Physics I: Mechanics, Energy, and Thermodynamics"
cuatrimestre = 2
position = 3
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Física para constructores, no para físicos. Entender el mundo físico lo suficiente para construir cosas que interactúen con él, y reconocer cuándo tus abstracciones ignoran restricciones reales."
objective_en = "Physics for builders, not for physicists. To understand the physical world well enough to build things that interact with it, and to recognize when abstractions ignore real constraints."
content_es = "Cinemática y dinámica. Leyes de Newton. Energía, trabajo, potencia y conservación. Momento lineal y angular. Oscilaciones. Sistemas continuos introductorios. Calor, temperatura, entropía y principios de termodinámica. Modelado físico, órdenes de magnitud, medición e incertidumbre experimental."
content_en = "Kinematics and dynamics. Newton's laws. Energy, work, power, and conservation. Linear and angular momentum. Oscillations. Introductory continuous systems. Heat, temperature, entropy, and the principles of thermodynamics. Physical modeling, orders of magnitude, measurement, and experimental uncertainty."
texts = [
  "Feynman, Richard P., Robert B. Leighton, and Matthew Sands. <em>The Feynman Lectures on Physics.</em> Vol. I. Caltech, 2013. feynmanlectures.caltech.edu.",
  "Mahajan, Sanjoy. <em>The Art of Insight in Science and Engineering.</em> MIT Press, 2014.",
  "Halliday, David, Robert Resnick, and Jearl Walker. <em>Fundamentals of Physics.</em> 11th ed. Wiley, 2018.",
]
references = [
  { name = "MIT 8.01 Classical Mechanics (Walter Lewin)", url = "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/" },
  { name = "Caltech Ph 1a Physics", url = "https://catalog.caltech.edu/current/courses/department/Ph" },
  { name = "École Polytechnique tronc commun Physique", url = "https://programmes.polytechnique.edu/cycle-ingenieur-polytechnicien/cycle-ingenieur-polytechnicien-program/academics" },
]
evaluation_primary = "WE, Written exam with unseen problems"
evaluation_secondaries = [
  "TP, Problem sets and estimation exercises",
]

[[course]]
slug = "programacion-algoritmos-y-sistemas-de-datos"
title_es = "Programación, Algoritmos y Sistemas de Datos"
title_en = "Programming, Algorithms, and Data Systems"
cuatrimestre = 2
position = 4
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Escribir software que hace lo que dice hacer, razonar sobre su costo y modelar los datos que usa. No velocidad de codificación, precisión conceptual: entender qué hace el código, por qué falla, cuánto cuesta, cómo saber que hace lo que uno cree y cómo diseñar datos que sobrevivan al uso real."
objective_en = "Write software that does what it claims to do, reason about its cost, and model the data it uses. Not coding speed, conceptual precision: understanding what code does, why it fails, what it costs, how to know it does what one believes, and how to design data that survives real use."
content_es = "Programación modular. Estructuras de datos. Complejidad algorítmica. Recursión, búsqueda, ordenamiento y grafos introductorios. Testing, debugging y control de versiones. SQL, modelo relacional, normalización, índices, transacciones introductorias y migraciones. Especificación, invariantes, tipos, prueba, contraejemplo y razonamiento formal aplicado a programas."
content_en = "Modular programming. Data structures. Algorithmic complexity. Recursion, search, sorting, and introductory graphs. Testing, debugging, and version control. SQL, the relational model, normalization, indexes, introductory transactions, and migrations. Specification, invariants, types, proof, counterexample, and formal reasoning applied to programs."
texts = [
  "Abelson, Harold, and Gerald Jay Sussman. <em>Structure and Interpretation of Computer Programs.</em> 2nd ed. MIT Press, 1996.",
  "Sedgewick, Robert, and Kevin Wayne. <em>Algorithms.</em> 4th ed. Addison-Wesley, 2011.",
  "McConnell, Steve. <em>Code Complete.</em> 2nd ed. Microsoft Press, 2004.",
