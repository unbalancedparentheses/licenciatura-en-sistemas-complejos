  { name = "Lean 4 / Mathlib community curriculum", url = "https://leanprover-community.github.io/" },
  { name = "Software Foundations", url = "https://softwarefoundations.cis.upenn.edu/" },
]
evaluation_primary = "OD, Defense of formal verification project"
evaluation_secondaries = [
  "TP, Lean 4 proof portfolio",
]

