  "Peters, Ole, and London Mathematical Laboratory papers on ergodicity. The distinction between ensemble averages and time averages — if a process is non-ergodic, the average across the group does not describe the experience of the individual, which fundamentally changes how risk, inequality, and decisions should be analyzed.",
  "Cirillo, Pasquale, and Nassim Nicholas Taleb. <em>The Logic of Risk</em> and joint papers on fat tails, wars, and pandemics — rigorous statistical formalization of the fat-tails framework with direct implications for policy and risk management.",
