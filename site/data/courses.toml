[[course]]
slug = "metodos-de-investigacion-medicion-y-diseno-experimental"
title_es = "Métodos de Investigación, Medición y Diseño Experimental"
title_en = "Research Methods, Measurement, and Experimental Design"
cuatrimestre = 7
position = 2
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Construir, medir y defender afirmaciones con evidencia. La materia que vuelve operativa la pregunta '¿cómo sé que esto es verdad?' Esencial cuando la IA puede generar texto convincente pero no puede generar evidencia."
objective_en = "To build, measure, and defend claims with evidence. The course that operationalizes the question 'how do I know this is true?' Essential when AI can generate convincing text but cannot generate evidence."
content_es = "Preguntas de investigación, hipótesis y operacionalización. Validez interna, externa, de constructo y de medición. Diseño experimental y cuasi-experimental. A/B testing, encuestas, entrevistas, medición de impacto, poder estadístico, preregistro, replicación y ciencia abierta. Ética de investigación y comunicación de resultados."
content_en = "Research questions, hypotheses, and operationalization. Internal, external, construct, and measurement validity. Experimental and quasi-experimental design. A/B testing, surveys, interviews, impact measurement, statistical power, preregistration, replication, and open science. Research ethics and communication of results."
notes_html_es = "La materia es operativa, no filosófica: Epistemología (3.er cuatrimestre) plantea los límites del conocimiento, esta materia construye las herramientas. Complementa Control, Observabilidad y Medición (5.º cuatrimestre): aquella mira la medición desde el sistema controlado, esta la mira desde el reclamo de evidencia. Corre en paralelo con Venture from Zero II, donde la iniciativa propia tiene que producir evidencia de uso e impacto."
notes_html_en = "The course is operational, not philosophical: Epistemology (3rd cuatrimestre) sets out the limits of knowledge, this course builds the tools. It complements Control, Observability, and Measurement (5th cuatrimestre): that course looks at measurement from the controlled system, this one from the evidentiary claim. It runs in parallel with Venture from Zero II, where the student's own initiative has to produce evidence of use and impact."
texts = [
  "Shadish, William R., Thomas D. Cook, and Donald T. Campbell. <em>Experimental and Quasi-Experimental Designs for Generalized Causal Inference.</em> Houghton Mifflin, 2002.",
  "Montgomery, Douglas C. <em>Design and Analysis of Experiments.</em> 10th ed. Wiley, 2019.",
  "Booth, Wayne C., Gregory G. Colomb, Joseph M. Williams, Joseph Bizup, and William T. FitzGerald. <em>The Craft of Research.</em> 4th ed. University of Chicago Press, 2016.",
  { citation = "Bergstrom, Carl T., and Jevin D. West. <em>Calling Bullshit: The Art of Skepticism in a Data-Driven World.</em> Random House, 2020.", note_es = "Lectura crítica en la era de la IA y los datos masivos: cómo distinguir señal de bullshit confiado.", note_en = "Critical reading in the age of AI and mass data: how to distinguish signal from confident bullshit." },
  { citation = "Ritchie, Stuart. <em>Science Fictions: How Fraud, Bias, Negligence, and Hype Undermine the Search for Truth.</em> Metropolitan Books, 2020.", note_es = "Crisis de replicación contemporánea, contexto de por qué los métodos importan operativamente.", note_en = "The contemporary replication crisis, context for why methods matter operationally." },
]
references = [
  { name = "Stanford GSB Methodology of Empirical Research", url = "https://www.gsb.stanford.edu/" },
  { name = "MIT 14.310x Data Analysis for Social Scientists", url = "https://ocw.mit.edu/courses/14-310x-data-analysis-for-social-scientists-spring-2023/" },
  { name = "Berkeley D-Lab Computational Social Science", url = "https://dlab.berkeley.edu/" },
  { name = "Center for Open Science training", url = "https://www.cos.io/" },
]
evaluation_primary = "OD, Defense of a research design proposal with measurement plan and pre-analysis"
evaluation_secondaries = [
  "TP, Replication audit of a published study",
]

[[course]]
slug = "teoria-de-la-decision"
title_es = "Teoría de la Decisión"
title_en = "Decision Theory"
cuatrimestre = 7
position = 3
hours = [3, 3]
audiences = ["students", "faculty", "authorities"]
objective_es = "Unificar la maquinaria formal de tomar decisiones bajo incertidumbre. La materia que formaliza el juicio. AGI puede optimizar una función objetivo dada. La pregunta humana es: ¿cuál es la función objetivo correcta?"
objective_en = "To unify the formal machinery of decision-making under uncertainty. The course that formalizes judgment. AI can optimize a given objective function. The human question is: what is the right objective function?"
content_es = "Decisión bajo incertidumbre. Utilidad esperada, actualización bayesiana, valor de la información y análisis de sensibilidad. Decisiones secuenciales, criterios múltiples, incertidumbre profunda y robustez. Sesgos, heurísticas, pronóstico, calibración y juicio experto. Decisiones con consecuencias éticas, institucionales y estratégicas."
content_en = "Decision under uncertainty. Expected utility, Bayesian updating, value of information, and sensitivity analysis. Sequential decisions, multiple criteria, deep uncertainty, and robustness. Biases, heuristics, forecasting, calibration, and expert judgment. Decisions with ethical, institutional, and strategic consequences."
texts = [
  "Raiffa, Howard. <em>Decision Analysis.</em> Addison-Wesley, 1968.",
  { citation = "Savage, Leonard J. <em>The Foundations of Statistics.</em> Wiley, 1954.", note_es = "Los axiomas fundacionales de la decisión bajo incertidumbre.", note_en = "The foundational axioms of decision under uncertainty." },
  "Kahneman, Daniel. <em>Thinking, Fast and Slow.</em> Farrar, Straus and Giroux, 2011.",
  { citation = "Gigerenzer, Gerd. <em>Gut Feelings: The Intelligence of the Unconscious.</em> Viking, 2007.", note_es = "Heurísticas rápidas que superan a los modelos formales en entornos inciertos, contrapunto empírico a la teoría de la utilidad esperada.", note_en = "Fast heuristics that outperform formal models in uncertain environments, empirical counterpoint to expected utility theory." },
  { citation = "Tetlock, Philip E., and Dan Gardner. <em>Superforecasting.</em> Crown, 2015.", note_es = "La práctica disciplinada de la predicción calibrada, conecta directamente con la actualización bayesiana.", note_en = "The disciplined practice of calibrated prediction, connects directly with Bayesian updating." },
  { citation = "Simon, Herbert A. <em>Models of Bounded Rationality.</em> MIT Press, 1982.", note_es = "Por qué los agentes reales satisfacen en lugar de optimizar.", note_en = "Why real agents satisfice rather than optimize." },
  { citation = "Williams, Bernard. <em>Ethics and the Limits of Philosophy.</em> Harvard University Press, 1985.", note_es = "Los tradeoffs trágicos son irreducibles: toda decisión importante tiene una dimensión ética que ningún framework limpio resuelve.", note_en = "Tragic tradeoffs are irreducible, every important decision has an ethical dimension that clean frameworks cannot resolve." },
  { citation = "Jonas, Hans. <em>The Imperative of Responsibility.</em> University of Chicago Press, 1984.", note_es = "Ética para sociedades tecnológicas, el principio de responsabilidad hacia las generaciones futuras como restricción sobre las decisiones presentes.", note_en = "Ethics for technological societies, the principle of responsibility toward future generations as a constraint on present decisions." },
]
references = [
  { name = "Stanford MS&E 250 Decision Analysis", url = "https://explorecourses.stanford.edu/search?q=MS%26E+250" },
  { name = "Harvard Kennedy School Decision Science", url = "https://www.hks.harvard.edu/educational-programs/courses" },
  { name = "Oxford PPE Philosophy component", url = "https://www.ppe.ox.ac.uk/" },
]
evaluation_primary = "OD, Defense of decision analysis of a real multi-criteria problem"
evaluation_secondaries = [
  "TP, Decision analysis built with AI",
]

[[course]]
slug = "comportamiento-humano-negociacion-y-conflicto"
title_es = "Comportamiento Humano, Negociación y Conflicto"
title_en = "Human Behavior, Negotiation, and Conflict"
cuatrimestre = 7
position = 4
hours = [3, 3]
audiences = ["students", "faculty", "authorities"]
objective_es = "Lograr cosas a través de otras personas cuando no tenés autoridad y la información es imperfecta, y coordinar organizaciones cuando los incentivos no se alinean solos. La materia combina la habilidad interpersonal de la negociación con la mirada estructural sobre cómo funcionan los equipos y las organizaciones."
objective_en = "To get things done through other people when you have no authority and information is imperfect, and to coordinate organizations when incentives do not align on their own. The course combines interpersonal skill in negotiation with a structural view of how teams and organizations work."
content_es = "Cooperación, conflicto, confianza, reciprocidad y coordinación. Negociación distributiva e integrativa. BATNA, ZOPA, compromisos creíbles, puntos focales y coaliciones. Persuasión, liderazgo sin autoridad formal y dinámica de equipos. Conflicto organizacional, acción colectiva y cooperación evolutiva. Simulaciones y debriefs."
content_en = "Cooperation, conflict, trust, reciprocity, and coordination. Distributive and integrative negotiation. BATNA, ZOPA, credible commitments, focal points, and coalitions. Persuasion, leadership without formal authority, and team dynamics. Organizational conflict, collective action, and evolutionary cooperation. Simulations and debriefs."
notes_html_es = "No se puede liderar lo que no se entiende, ni negociar bien sin saber cómo funcionan las contrapartes. La teoría del comportamiento explica <strong>por qué</strong> un equipo o una contraparte no hacen lo que se espera; las técnicas de negociación y liderazgo dicen <strong>qué hacer al respecto</strong>. Corre en paralelo con Venture from Zero II, donde aparecen contrapartes reales y dinámicas de equipo bajo presión."
notes_html_en = "One cannot lead what one does not understand, nor negotiate well without knowing how counterparts work. Behavioral theory explains <strong>why</strong> a team or counterpart is not doing what one expects; negotiation and leadership techniques say <strong>what to do about it</strong>. It runs in parallel with Venture from Zero II, where real counterparts and team dynamics under pressure appear."
texts = [
  "Fisher, Roger, William Ury, and Bruce Patton. <em>Getting to Yes.</em> Penguin Books, 2011.",
  { citation = "Voss, Chris. <em>Never Split the Difference.</em> Harper Business, 2016.", note_es = "Negociación de un ex negociador de rehenes del FBI, técnicas de aplicación inmediata.", note_en = "Negotiation from a former FBI hostage negotiator, immediately practical." },
  { citation = "Schelling, Thomas C. <em>The Strategy of Conflict.</em> Harvard University Press, 1960.", note_es = "Puntos focales y compromisos creíbles, puente entre teoría de juegos y negociación real.", note_en = "Focal points and credible commitments, bridge between game theory and real negotiation." },
  "Grove, Andrew S. <em>High Output Management.</em> Random House, 1983.",
  "Horowitz, Ben. <em>The Hard Thing About Hard Things.</em> Harper Business, 2014.",
  { citation = "MacIntyre, Alasdair. <em>After Virtue.</em> 3rd ed. University of Notre Dame Press, 2007.", note_es = "Por qué el liderazgo no se puede apoyar en frameworks éticos universales y necesita un juicio situado.", note_en = "Why leadership cannot rely on universal ethical frameworks and needs situated judgment." },
]
references = [
  { name = "Harvard Program on Negotiation", url = "https://www.pon.harvard.edu/" },
  { name = "MIT Sloan 15.665 Power and Negotiation", url = "https://ocw.mit.edu/courses/15-665-power-and-negotiation-spring-2014/" },
  { name = "Stanford MS&E 280 Organizational Behavior", url = "https://explorecourses.stanford.edu/search?q=MS%26E+280" },
  { name = "INSEAD Organisational Behaviour", url = "https://www.insead.edu/faculty-research/academic-areas/organisational-behaviour" },
]
evaluation_primary = "LC, Live negotiation exercise with real stakes"
evaluation_secondaries = [
  "OD, Defense of organizational diagnosis",
]

