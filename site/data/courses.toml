content_en = "Analysis of how cultural norms, legitimacy claims, and social expectations shape institutional behavior. Includes anime and science fiction canon treated as primary analytical material: Neon Genesis Evangelion, Ghost in the Shell, Foundation, Neuromancer."
notes_html = "These works are not entertainment: they are cultural artifacts that articulate the tensions between technology, institutions, identity, and power in ways academic papers cannot. AI writes convincing-but-shallow cultural analyses — students expose missing assumptions and connect cultural narratives to systemic stability."
texts = [
