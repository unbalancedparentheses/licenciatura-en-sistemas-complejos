[[course]]
slug = "econometria-procesos-estocasticos-y-riesgo"
title_es = "Econometría, Procesos Estocásticos y Riesgo"
title_en = "Econometrics, Stochastic Processes, and Risk"
cuatrimestre = 4
position = 3
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Pasar de correlación a causalidad, y de promedios a trayectorias. Bajo qué condiciones se puede afirmar que X causa Y, cómo modelar procesos que dependen del camino y por qué las métricas convencionales de riesgo fallan en dominios de colas gruesas."
objective_en = "Move from correlation to causation, and from averages to trajectories. Under what conditions one can claim that X causes Y, how to model path-dependent processes, and why conventional risk metrics fail in fat-tailed domains."
content_es = "Regresión y causalidad aplicada. Variables omitidas, endogeneidad, experimentos, diferencias en diferencias, discontinuidad e instrumentos introductorios. Procesos estocásticos básicos, cadenas de Markov y procesos de conteo. Riesgo, colas pesadas, no ergodicidad, ruina y límites de métricas convencionales."
content_en = "Regression and applied causality. Omitted variables, endogeneity, experiments, difference-in-differences, discontinuity, and introductory instruments. Basic stochastic processes, Markov chains, and counting processes. Risk, heavy tails, non-ergodicity, ruin, and the limits of conventional metrics."
notes_html_es = "Las colas pesadas no son un apéndice: son el argumento central de la segunda mitad de la materia. Se conecta con Biología (el colapso ecológico es un evento de cola gruesa), Física (sistemas lejos del equilibrio) y Epistemología (el problema de la inducción)."
notes_html_en = "Fat tails are not an appendix: they are the central argument of the second half of the course. It connects to Biology (ecological collapse is a fat-tailed event), Physics (systems far from equilibrium), and Epistemology (the problem of induction)."
texts = [
  "Angrist, Joshua D., and Jörn-Steffen Pischke. <em>Mostly Harmless Econometrics.</em> Princeton University Press, 2009.",
  "Cunningham, Scott. <em>Causal Inference: The Mixtape.</em> Yale University Press, 2021. mixtape.scunning.com.",
  "Pearl, Judea, and Dana Mackenzie. <em>The Book of Why.</em> Basic Books, 2018.",
  "Ross, Sheldon M. <em>Introduction to Probability Models.</em> 12th ed. Academic Press, 2019.",
  "Taleb, Nassim Nicholas. <em>Statistical Consequences of Fat Tails.</em> STEM Academic Press, 2020.",
  "Norris, J. R. <em>Markov Chains.</em> Cambridge University Press, 1997.",
]
references = [
  { name = "MIT 14.32 Econometric Data Science", url = "https://ocw.mit.edu/courses/14-32-econometric-data-science-fall-2021/" },
  { name = "Stanford MS&E 226 Causal Inference", url = "https://explorecourses.stanford.edu/search?q=MS%26E+226" },
  { name = "Caltech IDS 126", url = "https://catalog.caltech.edu/current/courses/department/IDS" },
  { name = "Stanford MS&E 221 Stochastic Modeling", url = "https://explorecourses.stanford.edu/search?q=MS%26E+221" },
  { name = "MIT 6.7700 Discrete Stochastic Processes", url = "https://ocw.mit.edu/courses/6-262-discrete-stochastic-processes-spring-2011/" },
  { name = "London Mathematical Laboratory: Ergodicity Economics", url = "https://ergodicityeconomics.com/" },
]
evaluation_primary = "OD, Defense of empirical study"
evaluation_secondaries = [
  "TP, Empirical study with real data",
  "OD, Defense of risk analysis",
]

[[course]]
slug = "sistemas-complejos"
title_es = "Sistemas Complejos"
title_en = "Complex Systems"
cuatrimestre = 4
position = 4
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender cómo el orden, el caos y la estructura emergen de la interacción de agentes simples, y por qué los sistemas complejos se resisten a la predicción y al control centralizado."
objective_en = "To understand how order, chaos, and structure emerge from the interaction of simple agents, and why complex systems resist prediction and centralized control."
content_es = "Emergencia, no linealidad, autoorganización y dependencia de camino. Redes complejas, modelos basados en agentes, cascadas, robustez y fragilidad. Sistemas adaptativos en biología, economía, tecnología e instituciones. Simulación, visualización y límites de predicción y control."
content_en = "Emergence, nonlinearity, self-organization, and path dependence. Complex networks, agent-based models, cascades, robustness, and fragility. Adaptive systems in biology, economics, technology, and institutions. Simulation, visualization, and the limits of prediction and control."
notes_html_es = "Conecta todo lo anterior: Biología (1.er cuatrimestre), Historia de las Instituciones (1.er cuatrimestre), Ecuaciones Diferenciales y Sistemas Dinámicos (3.er cuatrimestre) y Riesgo y colas pesadas (en paralelo). Los patrones de complejidad atraviesan los dominios: la falla en cascada de una red eléctrica, una corrida bancaria, una epidemia y un colapso institucional son el mismo fenómeno visto desde distintas disciplinas."
notes_html_en = "It connects everything before it: Biology (1st cuatrimestre), History of Institutions (1st cuatrimestre), Differential Equations and Dynamical Systems (3rd cuatrimestre), and Risk and fat tails (in parallel). Complexity patterns cut across domains: the cascading failure of a power grid, a bank run, an epidemic, and an institutional collapse are the same phenomenon seen from different disciplines."
texts = [
  "Mitchell, Melanie. <em>Complexity: A Guided Tour.</em> Oxford University Press, 2009.",
  "Barabási, Albert-László. <em>Network Science.</em> Cambridge University Press, 2016.",
  "Miller, John H., and Scott E. Page. <em>Complex Adaptive Systems.</em> Princeton University Press, 2007.",
  { citation = "West, Geoffrey. <em>Scale.</em> Penguin Press, 2017.", note_es = "Leyes universales de escala en biología, ciudades y economías: los mismos patrones matemáticos aparecen en sistemas radicalmente distintos, desde tasas metabólicas hasta innovación urbana.", note_en = "Universal scaling laws in biology, cities, and economies, the same mathematical patterns appear in radically different systems, from metabolic rates to urban innovation." },
]
references = [
  { name = "Santa Fe Institute Complexity Explorer", url = "https://www.complexityexplorer.org/" },
  { name = "MIT 18.354 Nonlinear Dynamics", url = "https://ocw.mit.edu/courses/18-354j-nonlinear-dynamics-ii-continuum-systems-spring-2015/" },
  { name = "Oxford Complex Systems", url = "https://www.maths.ox.ac.uk/groups/ociam" },
  { name = "Barabási Network Science", url = "https://networksciencebook.com/" },
]
evaluation_primary = "OD, Defense of agent-based model"
evaluation_secondaries = [
  "TP, Agent-based model of a real complex system",
]

[[course]]
slug = "deep-learning-y-sistemas-de-ia"
title_es = "Deep Learning y Sistemas de IA"
title_en = "Deep Learning and AI Systems"
cuatrimestre = 5
position = 1
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender en profundidad las arquitecturas, mecanismos y leyes de escala de los sistemas de IA que definen esta era, no como usuarios sino como ingenieros y críticos, y construir sistemas reales sobre modelos fundacionales: componerlos, orquestarlos, evaluarlos y desplegarlos en productos en los que se pueda confiar."
objective_en = "Understand in depth the architectures, mechanisms, and scaling laws of the AI systems that define this era, not as users but as engineers and critics, and build real systems on top of foundation models: composing, orchestrating, evaluating, and deploying them in products that can be trusted."
content_es = "Redes neuronales profundas. Backpropagation, optimización y regularización. Arquitecturas para visión, lenguaje y secuencias. Transformers y modelos fundacionales. Fine-tuning, prompting, RAG, agentes y evaluación. Seguridad, alineamiento, gobernanza de modelos, límites técnicos y operación de sistemas basados en IA."
content_en = "Deep neural networks. Backpropagation, optimization, and regularization. Architectures for vision, language, and sequences. Transformers and foundation models. Fine-tuning, prompting, RAG, agents, and evaluation. Safety, alignment, model governance, technical limits, and the operation of AI-based systems."
notes_html_es = "Es el eslabón entre los fundamentos de la IA (Machine Learning) y la creación (Venture from Zero). La mayoría de los productos que los egresados construirán se apoyan en modelos fundacionales que no entrenan, sino que orquestan y evalúan; esta materia enseña los mecanismos y esa capa de aplicación, con la disciplina de evaluación que distingue un sistema confiable de una demo."
notes_html_en = "It is the link between the foundations of AI (Machine Learning) and creation (Venture from Zero). Most products graduates will build rest on foundation models they do not train but orchestrate and evaluate; this course teaches the mechanisms and that application layer, with the evaluation discipline that separates a trustworthy system from a demo."
texts = [
  "Goodfellow, Ian, Yoshua Bengio, and Aaron Courville. <em>Deep Learning.</em> MIT Press, 2016. deeplearningbook.org.",
  "Prince, Simon J.D. <em>Understanding Deep Learning.</em> MIT Press, 2023. udlbook.github.io.",
  "Vaswani et al. \"Attention Is All You Need.\" NeurIPS, 2017.",
  "Kaplan et al. \"Scaling Laws for Neural Language Models.\" arXiv, 2020.",
  "Huyen, Chip. <em>AI Engineering: Building Applications with Foundation Models.</em> O'Reilly, 2025.",
  "Huyen, Chip. <em>Designing Machine Learning Systems.</em> O'Reilly, 2022.",
]
references = [
  { name = "Stanford CS 224N NLP with Deep Learning", url = "https://web.stanford.edu/class/cs224n" },
  { name = "Stanford CS 236 Deep Generative Models", url = "https://deepgenerativemodels.github.io/" },
  { name = "MIT 6.S898 Deep Learning", url = "https://deeplearning.mit.edu/" },
  { name = "fast.ai Practical Deep Learning", url = "https://course.fast.ai" },
  { name = "Andrej Karpathy: Neural Networks Zero to Hero, YouTube", url = "https://karpathy.ai/zero-to-hero.html" },
  { name = "Stanford CS25 Transformers United", url = "https://web.stanford.edu/class/cs25/" },
]
evaluation_primary = "LC, Live architecture session"
evaluation_secondaries = [
  "TP, Replication at reduced scale",
  "TP, An AI application with an evaluation harness and failure analysis",
]

[[course]]
slug = "diseno-de-producto-interaccion-y-estrategia"
title_es = "Diseño de Producto, Interacción y Estrategias"
title_en = "Product Design, Interaction, and Strategy"
cuatrimestre = 5
position = 2
hours = [3, 3]
audiences = ["students", "faculty", "authorities"]
objective_es = "Decidir qué construir y para quién, y diseñarlo de modo que la gente lo use. La materia cubre la dimensión estratégica (mercado, posicionamiento, distribución, ventaja) y la dimensión de diseño (investigación de usuarios, prototipado, interacción, experimentación) como una sola disciplina, porque en la práctica lo son: estrategia sin diseño produce productos que nadie usa, diseño sin estrategia produce productos que no escalan."
objective_en = "To decide what to build and for whom, and to design it so people actually use it. The course covers strategy (market, positioning, distribution, advantage) and design (user research, prototyping, interaction, experimentation) as a single discipline, because in practice they are: strategy without design produces products no one uses, design without strategy produces products that do not scale."
content_es = "Investigación de usuarios. Problemas, hipótesis, prototipos y tests de usabilidad. Diseño de interacción, arquitectura de información, onboarding, errores y feedback. Estrategia de producto, segmentación, posicionamiento, distribución, pricing, unit economics y métricas. Producto con IA: interfaces conversacionales, automatización, explicabilidad y control del usuario."
content_en = "User research. Problems, hypotheses, prototypes, and usability tests. Interaction design, information architecture, onboarding, errors, and feedback. Product strategy, segmentation, positioning, distribution, pricing, unit economics, and metrics. AI products: conversational interfaces, automation, explainability, and user control."
notes_html_es = "La fusión es deliberada: la separación habitual entre estrategia y diseño es un artefacto de cómo están organizadas las business schools y las design schools, no un reflejo de cómo se construyen productos reales. El equipo que decide qué construir es el mismo que decide cómo construirlo. Esta materia entrena ambas decisiones a la vez y prepara directamente Venture from Zero (Talleres VI a VIII)."
notes_html_en = "The fusion is deliberate: the usual separation between strategy and design is an artifact of how business schools and design schools are organized, not a reflection of how real products are built. The team that decides what to build is the same team that decides how to build it. This course trains both decisions at once and prepares directly for Venture from Zero (Talleres VI to VIII)."
texts = [
  "Rumelt, Richard P. <em>Good Strategy Bad Strategy.</em> Crown Business, 2011.",
  "Christensen, Clayton M. <em>The Innovator's Dilemma.</em> Harvard Business Review Press, 1997.",
  "Ries, Eric. <em>The Lean Startup.</em> Crown Business, 2011.",
  "Norman, Donald A. <em>The Design of Everyday Things.</em> Basic Books, 2013.",
  "Cooper, Alan, Robert Reimann, and David Cronin. <em>About Face: The Essentials of Interaction Design.</em> 4th ed. Wiley, 2014.",
  { citation = "Bryar, Colin, and Bill Carr. <em>Working Backwards.</em> St. Martin's Press, 2021.", note_es = "Cómo Amazon une estrategia, escritura, mecanismos operativos y diseño de producto en una sola práctica.", note_en = "How Amazon unifies strategy, writing, operating mechanisms, and product design as one practice." },
]
references = [
  { name = "Stanford CS 183 Startup", url = "https://startupclass.samaltman.com/" },
  { name = "Stanford d.school Design Thinking", url = "https://dschool.stanford.edu/" },
  { name = "MIT 15.835 Entrepreneurial Marketing", url = "https://ocw.mit.edu/courses/15-835-entrepreneurial-marketing-spring-2002/" },
  { name = "MIT Integrated Design and Management", url = "https://idm.mit.edu/" },
  { name = "Carnegie Mellon Human-Computer Interaction", url = "https://hcii.cmu.edu/" },
]
evaluation_primary = "PD, Public defense of strategy and product with usability evidence"
evaluation_secondaries = [
  "TP, Strategic and design portfolio built with AI",
]

[[course]]
slug = "control-observabilidad-y-medicion"
title_es = "Control, Observabilidad y Medición"
title_en = "Control, Observability, and Measurement"
cuatrimestre = 5
position = 3
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender feedback, estabilidad y observabilidad, y qué le hace la medición a las cosas que mide. La materia que une control de sistemas con la epistemología y la política de las métricas."
objective_en = "To understand feedback, stability, and observability, and what measurement does to the things it measures. The course that fuses systems control with the epistemology and politics of metrics."
content_es = "Feedback, control, estabilidad y respuesta dinámica. Observabilidad, instrumentación, métricas y señales. Tableros, alertas y experimentos operativos. Ley de Goodhart, gaming de métricas y efectos de medición sobre el sistema medido. Resiliencia, degradación grácil, recuperación y blast radius."
content_en = "Feedback, control, stability, and dynamic response. Observability, instrumentation, metrics, and signals. Dashboards, alerts, and operational experiments. Goodhart's law, metric gaming, and the effects of measurement on the measured system. Resilience, graceful degradation, recovery, and blast radius."
texts = [
  "Åström, Karl J., and Richard M. Murray. <em>Feedback Systems.</em> Princeton University Press, 2008.",
  "Leveson, Nancy G. <em>Engineering a Safer World.</em> MIT Press, 2011.",
  "Meadows, Donella H. <em>Thinking in Systems.</em> Chelsea Green, 2008.",
  { citation = "Porter, Theodore M. <em>Trust in Numbers: The Pursuit of Objectivity in Science and Public Life.</em> Princeton University Press, 1995.", note_es = "La construcción histórica de la cuantificación como autoridad.", note_en = "The historical construction of quantification as authority." },
  { citation = "Muller, Jerry Z. <em>The Tyranny of Metrics.</em> Princeton University Press, 2018.", note_es = "Por qué la gestión guiada por métricas distorsiona sistemáticamente aquello que dice optimizar.", note_en = "Why measurement-driven management systematically distorts what it claims to optimize." },
  { citation = "Espeland, Wendy Nelson, and Mitchell L. Stevens. \"Commensuration as a Social Process.\" <em>Annual Review of Sociology,</em> 1998.", note_es = "Volver conmensurables las cosas es en sí mismo un acto político.", note_en = "How making things commensurable is itself a political act." },
  "Goodhart, Charles. \"Problems of Monetary Management\" (1975) and Strathern's later restatement: <em>\"When a measure becomes a target, it ceases to be a good measure.\"</em>",
]
references = [
  { name = "Stanford EE 263 Linear Dynamical Systems", url = "https://web.stanford.edu/class/ee263/" },
  { name = "MIT 6.3100 Dynamical Systems and Control", url = "https://ocw.mit.edu/courses/6-241j-dynamic-systems-and-control-spring-2011/" },
  { name = "Caltech CDS 110 Introduction to Control", url = "https://www.cds.caltech.edu/~murray/courses/cds110/" },
]
evaluation_primary = "WE, Written exam"
evaluation_secondaries = [
  "OD, Defense of system stability analysis",
]

[[course]]
slug = "economia-politica-derecho-y-regulacion"
title_es = "Economía Política, Derecho y Regulación"
title_en = "Political Economy, Law, and Regulation"
cuatrimestre = 5
position = 4
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender cómo la regulación, la tributación, la responsabilidad legal y las políticas públicas determinan lo que se puede construir."
objective_en = "To understand how regulation, taxation, legal liability, and public policy determine what can be built."
content_es = "Mercados, Estado, empresas y regulación. Fallas de mercado, bienes públicos, externalidades, captura regulatoria y enforcement. Derecho administrativo y marcos regulatorios básicos. Regulación de tecnología, datos, plataformas, competencia, infraestructura e IA. Historia del pensamiento económico: Smith, Marx, Keynes, Hayek, Minsky y Ostrom. Ideas económicas, intereses, instituciones y crisis."
content_en = "Markets, the state, firms, and regulation. Market failures, public goods, externalities, regulatory capture, and enforcement. Administrative law and basic regulatory frameworks. Regulation of technology, data, platforms, competition, infrastructure, and AI. History of economic thought: Smith, Marx, Keynes, Hayek, Minsky, and Ostrom. Economic ideas, interests, institutions, and crises."
texts = [
  "Acemoglu, Daron, and James A. Robinson. <em>The Narrow Corridor.</em> Penguin Press, 2019.",
  "Lessig, Lawrence. <em>Code: And Other Laws of Cyberspace.</em> Basic Books, 1999.",
  "Tirole, Jean. <em>Economics for the Common Good.</em> Princeton University Press, 2017.",
  { citation = "Polanyi, Karl. <em>The Great Transformation.</em> Beacon Press, 1944.", note_es = "El mercado no es natural, fue construido políticamente. Contrapunto imprescindible a Hayek.", note_en = "The market is not natural, it was politically constructed. Essential counterpoint to Hayek." },
  "Zuboff, Shoshana. <em>The Age of Surveillance Capitalism.</em> PublicAffairs, 2019.",
  { citation = "Land, Nick. Selections from <em>Fanged Noumena.</em> Urbanomic, 2011.", note_es = "Aceleracionismo, la inteligencia como proceso que excede lo humano, el capital como IA <em>avant la lettre</em>, leído como objeto de análisis, no como doctrina.", note_en = "Accelerationism, intelligence as a process exceeding the human, capital as AI <em>avant la lettre</em>, taught as object of analysis, not doctrine." },
  { citation = "Srnicek, Nick, and Alex Williams. <em>Inventing the Future.</em> Verso, 2015.", note_es = "Toma las premisas de Land y las gira hacia la izquierda; el contraste es pedagógicamente potente.", note_en = "Take Land's premises and turn them leftward, the contrast is pedagogically potent." },
  { citation = "Brown, Wendy. <em>Undoing the Demos.</em> Zone Books, 2015.", note_es = "El neoliberalismo como racionalidad que convierte todo en lógica de mercado, incluidas la política y la subjetividad.", note_en = "Neoliberalism as a rationality that converts everything into market logic, including politics and subjectivity." },
  { citation = "Davidson, James Dale, and William Rees-Mogg. <em>The Sovereign Individual.</em> Touchstone, 1997.", note_es = "Predijo en 1997 cómo la tecnología iba a desplazar el poder entre individuos y estados; el marco sigue siendo notablemente útil para analizar las dinámicas actuales.", note_en = "Predicted in 1997 how technology would shift power between individuals and states, the framework remains remarkably useful for analyzing current dynamics." },
]
references = [
  { name = "MIT 14.42 Environmental Policy and Economics", url = "https://ocw.mit.edu/courses/14-42-environmental-policy-and-economics-spring-2011/" },
  { name = "Stanford Law and Technology", url = "https://law.stanford.edu/courses/" },
  { name = "Oxford PPE Politics and Philosophy components", url = "https://www.ppe.ox.ac.uk/" },
]
evaluation_primary = "OD, Adversarial defense of policy analysis"
evaluation_secondaries = [
  "TP, Policy analysis with stakeholder map",
]

[[course]]
