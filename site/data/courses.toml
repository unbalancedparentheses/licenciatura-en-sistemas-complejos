[[course]]
slug = "seminario-fundacional-ia-juicio-y-responsabilidad"
title_es = "Seminario Fundacional: IA, Juicio y Responsabilidad"
title_en = "Founding Seminar: AI, Judgment and Responsibility"
year = 3.5
block = "A"
position = 1
audiences = ["students", "faculty", "authorities"]
objective_es = "El argumento fundacional del programa, dado explícitamente después de tres años de haberlo vivido. Qué cambia con la IA, qué no cambia, qué es el juicio, por qué la legitimidad importa."
objective_en = "The founding argument of the program, given explicitly after three years of living it. What AI changes, what it does not, what judgment is, why legitimacy matters."
content_es = "Síntesis final del programa. Qué automatiza la IA y qué desplaza en la economía del conocimiento. Juicio: decisión bajo incertidumbre, objetivos mal especificados, responsabilidad por consecuencias y capacidad de decir no. Legitimidad: confianza, autoridad, explicación pública, instituciones y consentimiento de los afectados. Alineamiento, fallas de especificación, delegación a sistemas opacos, automation bias y accountability. Discusión de casos: sistemas públicos automatizados, modelos fundacionales, decisiones médicas o financieras, infraestructura crítica y ventures construidos en Studio VI. El seminario culmina en una posición defendida públicamente sobre qué debe seguir siendo responsabilidad humana."
content_en = "Final synthesis of the program. What AI automates and what it displaces in the knowledge economy. Judgment: decision under uncertainty, misspecified objectives, responsibility for consequences, and the capacity to say no. Legitimacy: trust, authority, public explanation, institutions, and consent of affected people. Alignment, specification failures, delegation to opaque systems, automation bias, and accountability. Case discussions: automated public systems, foundation models, medical or financial decisions, critical infrastructure, and ventures built in Studio VI. The seminar culminates in a publicly defended position on what must remain a human responsibility."
texts = [
  "Russell, Stuart. <em>Human Compatible.</em> Viking, 2019.",
  "Dreyfus, Hubert L. <em>What Computers Can't Do.</em> Harper & Row, 1972.",
  "Jonas, Hans. <em>The Imperative of Responsibility.</em> University of Chicago Press, 1984.",
  "Christian, Brian. <em>The Alignment Problem.</em> W. W. Norton, 2020.",
]
references = []
evaluation_primary = "OD, Oral defense of position paper"
evaluation_secondaries = [
  "TP, Position paper on what AI changes and what it does not",
]

[[course]]
slug = "biologia"
title_es = "Biología de Sistemas, Evolución y Ecología"
title_en = "Systems Biology, Evolution and Ecology"
year = 1
block = "D"
position = 2
audiences = ["students", "faculty", "authorities"]
objective_es = "Estudiar sistemas vivos como sistemas adaptativos complejos: evolución, ecología, redes regulatorias, inmunidad, epidemias, robustez y fragilidad. La materia no es una introducción genérica a la biología sino una lente para entender adaptación, selección, feedback, coevolución, colapso ecológico y optimización bajo restricciones."
objective_en = "To study living systems as complex adaptive systems: evolution, ecology, regulatory networks, immunity, epidemics, robustness, and fragility. This is not a generic introduction to biology but a lens for understanding adaptation, selection, feedback, coevolution, ecological collapse, and optimization under constraints."
content_es = "Evolución por selección y dinámica adaptativa. Genética y biología celular solo en la medida necesaria para entender mecanismos de regulación, herencia y variación. Redes biológicas, feedback y homeostasis. Inmunidad como sistema de detección, memoria y respuesta. Ecología, estabilidad, resiliencia, cascadas tróficas y colapso. Epidemiología y difusión. Teoría de juegos evolutiva, cooperación, competencia y coevolución. Robustez, fragilidad, redundancia, tradeoffs y path dependence. Uso cuidadoso de analogías biológicas en instituciones, IA y diseño de sistemas."
content_en = "Evolution by selection and adaptive dynamics. Genetics and cell biology only as needed to understand regulation, inheritance, and variation. Biological networks, feedback, and homeostasis. Immunity as a system of detection, memory, and response. Ecology, stability, resilience, trophic cascades, and collapse. Epidemiology and diffusion. Evolutionary game theory, cooperation, competition, and coevolution. Robustness, fragility, redundancy, tradeoffs, and path dependence. Careful use of biological analogies in institutions, AI, and systems design."
notes_html_es = "El objetivo es que los estudiantes incorporen un dominio de complejidad que no fue diseñado por humanos. Física enseña leyes, restricciones y conservación; biología enseña adaptación, falla, selección y supervivencia bajo condiciones cambiantes. La materia exige modelos, estimaciones y diagramas causales, no memorización taxonómica ni una orientación pre-médica."
notes_html_en = "The goal is for students to internalize a domain of complexity not designed by humans. Physics teaches laws, constraints, and conservation; biology teaches adaptation, failure, selection, and survival under changing conditions. The course requires models, estimates, and causal diagrams, not taxonomic memorization or a pre-medical orientation."
texts = [
  "Carroll, Sean B. <em>The Serengeti Rules.</em> Princeton University Press, 2016.",
  "Maynard Smith, John. <em>Evolution and the Theory of Games.</em> Cambridge University Press, 1982.",
  "Nowak, Martin A. <em>Evolutionary Dynamics: Exploring the Equations of Life.</em> Belknap Press, 2006.",
  "Levin, Simon A. <em>Fragile Dominion: Complexity and the Commons.</em> Perseus Books, 1999.",
  { citation = "Alberts, Bruce, et al. <em>Essential Cell Biology.</em> 5th ed. W. W. Norton, 2019.", note_es = "Referencia de consulta para mecanismos celulares, no columna vertebral de la materia.", note_en = "Reference for cellular mechanisms, not the backbone of the course." },
  "Dawkins, Richard. <em>The Selfish Gene.</em> 40th Anniversary ed. Oxford University Press, 2016.",
]
references = [
  { name = "MIT 7.013 Introductory Biology", url = "https://ocw.mit.edu/courses/7-013-introductory-biology-spring-2018/" },
  { name = "MIT 7.91J Foundations of Computational and Systems Biology", url = "https://ocw.mit.edu/courses/7-91j-foundations-of-computational-and-systems-biology-spring-2014/" },
  { name = "Caltech Bi 1 Principles of Biology", url = "https://catalog.caltech.edu/current/courses/department/Bi" },
  { name = "École Polytechnique tronc commun Biologie", url = "https://programmes.polytechnique.edu/cycle-ingenieur-polytechnicien/cycle-ingenieur-polytechnicien-program/academics" },
]
evaluation_primary = "OD, Defense of analysis of a biological system"
evaluation_secondaries = [
  "TP, Quantitative analysis with estimates and models",
]

