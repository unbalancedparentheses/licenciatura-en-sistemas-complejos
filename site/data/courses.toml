[[course.extra_section]]
label = "Canon de análisis / Primary cultural canon"
html = """
<p><strong>Anime:</strong></p>
  <ul>
    <li><em>Neon Genesis Evangelion</em> — technology, dysfunctional institutions (NERV), individual responsibility under institutional pressure, the limits of human control over systems we don't understand.</li>
    <li><em>Serial Experiments Lain</em> — identity, reality, and the dissolution of the boundary between the digital and the human; philosophy of mind disguised as anime.</li>
    <li><em>Ghost in the Shell</em> — consciousness in a world of artificial bodies; connects directly with Epistemología and the Limits of AI.</li>
    <li><em>Ergo Proxy</em> — post-collapse societies, authoritarian governance, what it means to be human when machines are conscious.</li>
    <li><em>Akira</em> — technology, state power, and destruction.</li>
  </ul>
  <p><strong>Science fiction:</strong></p>
  <ul>
    <li>Asimov, <em>Foundation</em> — psychohistory: can the behavior of complex systems be predicted and designed at civilizational scale? Connects directly with Sistemas Complejos.</li>
    <li>Asimov, "The Last Question" — entropy, information, and the limits of computation.</li>
    <li>Gibson, <em>Neuromancer</em> — invented the concept of cyberspace; defines the aesthetic of the human-machine relationship.</li>
    <li>Dick, <em>Do Androids Dream of Electric Sheep?</em> / <em>Blade Runner</em> — empathy as a test of humanity.</li>
    <li><em>Black Mirror</em> (selected episodes) — unintended consequences of technology.</li>
    <li><em>The Matrix</em> — simulation, reality, and the Chinese Room turned into film.</li>
  </ul>
  <p><em>These works are not entertainment: they are cultural artifacts that articulate the tensions between technology, institutions, identity, and power in ways academic papers cannot. AI writes convincing-but-shallow cultural analyses — students expose missing assumptions and connect cultural narratives to systemic stability.</em></p>
"""

[[course]]
slug = "epistemologia-ciencia-y-los-limites-de-la-ia"
title_es = "Epistemología, Ciencia y los Límites de la IA"
title_en = "Epistemology, Science and the Limits of AI"
year = 2
block = "D"
position = 3
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender qué cuenta como conocimiento, qué hace válido a un modelo y qué pueden y no pueden hacer las máquinas. La materia que examina la afirmación fundacional del programa: que la AGI aún no puede ser confiada con el juicio."
objective_en = "To understand what counts as knowledge, what makes a model valid, and what machines can and cannot do. The course that examines the program's founding claim: that AI cannot yet be trusted with judgment."
content_es = "Epistemología, filosofía de la ciencia (falsabilidad, paradigmas, validez de modelos), filosofía de la mente y la IA (la Habitación China, el problema del anclaje simbólico, consciencia y computación, el problema del alineamiento)."
content_en = "Epistemology, philosophy of science (falsifiability, paradigms, model validity), philosophy of mind and AI (the Chinese Room, the symbol grounding problem, consciousness and computation, the alignment problem)."
notes_html = "Philosophy of science is not abstract — it is operational for builders. Lakatos shows how mathematics actually works as human activity. Feyerabend demonstrates that science advances by transgression, not method. Cartwright exposes that scientific models idealize, they don't describe. Hacking distinguishes representing the world from intervening in it. Latour reveals science as a network of actors, instruments, and institutions. These thinkers dismantle the idea that science is pure disembodied rationality — essential for students who will build models and confuse them with truth."
texts = [
  "Kuhn, Thomas S. <em>The Structure of Scientific Revolutions.</em> 4th ed. University of Chicago Press, 2012.",
  "Dreyfus, Hubert L. <em>What Computers Can't Do.</em> Harper & Row, 1972. The most powerful phenomenological critique of AI — was right about GOFAI, his arguments about embodiment remain unresolved by LLMs.",
  "Dennett, Daniel C. <em>Consciousness Explained.</em> Little, Brown, 1991. The functionalist / deflationary position — direct counterpoint to Dreyfus; the Dreyfus–Dennett debate is the central axis of philosophy of AI.",
  "Russell, Stuart. <em>Human Compatible.</em> Viking, 2019. The alignment problem from a founder of the field — why machines optimizing misspecified objectives are dangerous.",
  "Christian, Brian. <em>The Alignment Problem.</em> W. W. Norton, 2020. The history and current state of aligning AI systems with human values.",
  "Cartwright, Nancy. <em>How the Laws of Physics Lie.</em> Oxford University Press, 1983. Models idealize, they don't describe — crucial for ML builders.",
  "Polanyi, Michael. <em>Personal Knowledge.</em> University of Chicago Press, 1958. Tacit knowledge — what an expert knows that cannot be formalized, with implications for the limits of AI.",
  "Feyerabend, Paul. <em>Against Method.</em> 4th ed. Verso, 2010. Epistemological anarchism — science advances by transgression.",
  "Lakatos, Imre. <em>Proofs and Refutations.</em> Cambridge University Press, 1976. The best text on how mathematics actually works — connects with Métodos Formales.",
  "Hacking, Ian. <em>Representing and Intervening.</em> Cambridge University Press, 1983. Science is not just models — it is the manipulation of reality.",
  "Latour, Bruno. <em>Science in Action.</em> Harvard University Press, 1987. Science as a network of actors, instruments, and institutions.",
  "Hui, Yuk. <em>The Question Concerning Technology in China.</em> Urbanomic, 2016. The relation to technē is not universal — there are distinct cosmotechnics; the best contemporary response to Heidegger from a non-Western perspective.",
  "Simondon, Gilbert. <em>On the Mode of Existence of Technical Objects.</em> Univocal, 2017. Technical objects have their own evolutionary logic — they are not mere instruments.",
  "Haraway, Donna. <em>Cyborg Manifesto.</em> 1985. The dissolution of human/machine boundaries as opportunity, not threat.",
  "Bostrom, Nick. <em>Superintelligence.</em> Oxford University Press, 2014.",
]
references = [
  { name = "Stanford Symbolic Systems Program", url = "https://symsys.stanford.edu/" },
