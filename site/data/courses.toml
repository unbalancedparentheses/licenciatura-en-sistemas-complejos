  "Walsh, Rodolfo. Selected political and journalistic writing.",
  "Martínez Estrada, Ezequiel. <em>Radiografía de la Pampa.</em> Losada, 1933.",
  "Cortázar, Julio. Selected essays on structure and form.",
]
references = []
evaluation_primary = "WP, Written portfolio with full revision history"
evaluation_secondaries = []

[[course]]
slug = "comportamiento-organizacional-y-equipos"
title_es = "Comportamiento Organizacional y Equipos"
title_en = "Organizational Behavior and Teams"
year = 3
block = "D"
position = 1
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender cómo las organizaciones realmente funcionan, y liderar personas dentro de ellas. Primera mitad: analítica. Segunda mitad: práctica."
objective_en = "To understand how organizations actually work, and to lead people within them. First half: analytical. Second half: practical."
content_es = "La organización como sistema de coordinación: objetivos, información, autoridad, incentivos, cultura, estructura informal y restricciones de ejecución. Principal-agente, costos de coordinación, delegación, hiring, onboarding, performance management, diseño de reuniones, cadencias operativas, métricas internas y postmortems. Dinámica de equipos: confianza, conflicto, accountability, estándares, burnout, aprendizaje y toma de decisiones. Casos de organizaciones que escalan, se burocratizan, se fragmentan o fallan bajo presión. La segunda mitad aplica diagnóstico e intervención sobre equipos reales o simulados."
content_en = "The organization as a coordination system: goals, information, authority, incentives, culture, informal structure, and execution constraints. Principal-agent problems, coordination costs, delegation, hiring, onboarding, performance management, meeting design, operating cadences, internal metrics, and postmortems. Team dynamics: trust, conflict, accountability, standards, burnout, learning, and decision-making. Cases of organizations that scale, bureaucratize, fragment, or fail under pressure. The second half applies diagnosis and intervention to real or simulated teams."
notes_html_es = "La fusión es natural: no se puede liderar lo que no se entiende estructuralmente, y no se pueden diagnosticar organizaciones sin herramientas de intervención. Principal-agente explica <strong>por qué</strong> tu equipo no está haciendo lo que esperás; el liderazgo situacional te dice <strong>qué hacer al respecto</strong>. Negociación cubre la interacción entre pares; esta materia cubre la responsabilidad asimétrica, cuando uno toma la decisión y otros viven con las consecuencias."
notes_html_en = "The fusion is natural: you cannot lead what you don't structurally understand, and you cannot diagnose organizations without intervention tools. Principal-agent explains <strong>why</strong> your team isn't doing what you expect; situational leadership tells you <strong>what to do about it</strong>. Negociación covers peer-to-peer interaction; this course covers asymmetric responsibility, when you make the decision and others live with the consequences."
texts = [
  "March, James G. <em>A Primer on Decision Making.</em> Free Press, 1994.",
  "Grove, Andrew S. <em>High Output Management.</em> Random House, 1983.",
  "Horowitz, Ben. <em>The Hard Thing About Hard Things.</em> Harper Business, 2014.",
  "Lencioni, Patrick. <em>The Five Dysfunctions of a Team.</em> Jossey-Bass, 2002.",
  "Milgrom, Paul, and John Roberts. <em>Economics, Organization and Management.</em> Prentice Hall, 1992.",
  { citation = "MacIntyre, Alasdair. <em>After Virtue.</em> 3rd ed. University of Notre Dame Press, 2007.", note_es = "La crisis del lenguaje moral moderno: por qué quienes lideran no pueden apoyarse en frameworks éticos universales y necesitan un juicio situado.", note_en = "The crisis of modern moral language, why leaders cannot rely on universal ethical frameworks and need situated judgment." },
  { citation = "Weil, Simone. <em>La gravedad y la gracia</em> / <em>Gravity and Grace.</em> 1947.", note_es = "La atención como acto ético fundamental: la responsabilidad de quien lidera empieza por prestar atención real a las personas que dependen de sus decisiones.", note_en = "Attention as a fundamental ethical act, the leader's responsibility begins with paying real attention to the people who depend on their decisions." },
]
references = [
  { name = "Stanford MS&E 280 Organizational Behavior", url = "https://explorecourses.stanford.edu/search?q=MS%26E+280" },
  { name = "MIT Sloan 15.322 Leading Organizations", url = "https://ocw.mit.edu/courses/15-668-people-and-organizations-fall-2010/" },
  { name = "Harvard Business School Leadership", url = "https://www.hbs.edu/mba/academic-experience/curriculum/Pages/course-catalog.aspx" },
  { name = "INSEAD Organisational Behaviour", url = "https://www.insead.edu/faculty-research/academic-areas/organisational-behaviour" },
]
evaluation_primary = "OD, Defense of organizational diagnosis"
evaluation_secondaries = [
  "TP, Diagnosis of a real or simulated organization",
]

[[course]]
slug = "sistemas-de-datos"
title_es = "Sistemas de Datos"
title_en = "Data Systems"
year = 3
block = "D"
position = 2
audiences = ["students", "faculty", "authorities"]
objective_es = "Diseñar sistemas donde los datos sobrevivan al uso real: almacenamiento, consulta, transacciones, recuperación, replicación, migraciones, gobernanza y operación. La materia que hace explícito el sustrato que todo venture, servicio público, sistema de ML y dashboard de monitoreo necesita."
objective_en = "To design systems where data survives real use: storage, querying, transactions, recovery, replication, migrations, governance, and operations. The course that makes explicit the substrate every venture, public service, ML system, and monitoring dashboard needs."
content_es = "Modelo relacional, SQL avanzado, modelado de datos, normalización y diseño de esquemas. Índices, query planning, almacenamiento, logs, transacciones, aislamiento, concurrencia, recovery y backups. Replicación, particionamiento, consistencia, sistemas analíticos vs operacionales, data warehouses, lakehouses, pipelines, streaming, calidad de datos, linaje, migraciones, observabilidad, control de acceso, privacidad, retención, gobernanza y operación de datos bajo incidentes."
content_en = "Relational model, advanced SQL, data modeling, normalization, and schema design. Indexes, query planning, storage, logs, transactions, isolation, concurrency, recovery, and backups. Replication, partitioning, consistency, analytical vs operational systems, data warehouses, lakehouses, pipelines, streaming, data quality, lineage, migrations, observability, access control, privacy, retention, governance, and data operations under incidents."
