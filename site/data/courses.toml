objective_es = "Diseñar productos que la gente realmente use. En un mundo con AGI, el cuello de botella se mueve de ¿podemos construirlo? a ¿estamos construyendo lo correcto?"
objective_en = "To design products that people actually use. In a world with AI, the bottleneck moves from \"can we build it?\" to \"are we building the right thing?\""
content_es = "Investigación de usuarios, entrevistas, observación contextual, jobs-to-be-done, journey maps, personas como hipótesis, definición de problemas y criterios de éxito. Arquitectura de información, flujos, interacción, prototipado de baja y alta fidelidad, usabilidad, accesibilidad, onboarding, empty states, errores, feedback, confianza y diseño para fallas. Analítica de producto, experimentos, métricas de activación, retención y conversión, instrumentación y aprendizaje iterativo. Diseño con IA: copilotos, interfaces conversacionales, límites de automatización, explicación, control del usuario y responsabilidad por decisiones automatizadas."
content_en = "User research, interviews, contextual observation, jobs-to-be-done, journey maps, personas as hypotheses, problem definition, and success criteria. Information architecture, flows, interaction, low- and high-fidelity prototyping, usability, accessibility, onboarding, empty states, errors, feedback, trust, and design for failure. Product analytics, experiments, activation, retention, and conversion metrics, instrumentation, and iterative learning. Design with AI: copilots, conversational interfaces, limits of automation, explanation, user control, and responsibility for automated decisions."
