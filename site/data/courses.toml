  { name = "MIT 18.02 Multivariable Calculus", url = "https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/" },
  { name = "MIT 18.100A Real Analysis", url = "https://ocw.mit.edu/courses/18-100a-real-analysis-fall-2020/" },
  { name = "Caltech Ma 1abc Mathematics", url = "https://pma.caltech.edu/courses" },
  { name = "École Polytechnique tronc commun (modules de mathématiques)", url = "https://programmes.polytechnique.edu/cycle-ingenieur-polytechnicien/cycle-ingenieur-polytechnicien-program/academics" },
]
