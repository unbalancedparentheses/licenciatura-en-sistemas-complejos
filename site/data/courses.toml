objective_en = "Build, train, evaluate, deploy, and monitor ML models, and know when not to use them. The mathematical foundations come from linear algebra, calculus, and probability. This course teaches the engineering."
content_es = "Aprendizaje supervisado y no supervisado. Regresión, clasificación, árboles, ensambles, clustering y reducción de dimensión. Validación, overfitting, regularización y métricas. Pipelines de datos, entrenamiento, evaluación, versionado, monitoreo, drift, privacidad, fairness, seguridad y criterios para no usar ML."
content_en = "Supervised and unsupervised learning. Regression, classification, trees, ensembles, clustering, and dimensionality reduction. Validation, overfitting, regularization, and metrics. Data pipelines, training, evaluation, versioning, monitoring, drift, privacy, fairness, security, and criteria for not using ML."
