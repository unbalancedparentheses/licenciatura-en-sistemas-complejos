[[course]]
slug = "laboratorio-de-diseno-institucional"
title_es = "Laboratorio de Diseño Institucional"
title_en = "Institutional Design Laboratory"
year = 3
block = "B"
position = 1
audiences = ["students", "faculty", "authorities"]
objective_es = "Diseñar instituciones que sobrevivan al contacto con personas reales. La materia donde los estudiantes sintetizan el diseño de mecanismos, la teoría organizacional, la economía política y el razonamiento legal en arquitectura institucional."
objective_en = "To design institutions that survive contact with real people. The course where students synthesize mechanism design, organizational theory, political economy, and legal reasoning into institutional architecture."
content_es = "Diagnóstico institucional: problema público o privado, actores, mandatos, recursos, restricciones legales, capacidades existentes y modos de falla. Diseño de reglas, incentivos, mecanismos de decisión, derechos de acceso, rendición de cuentas y enforcement. Gobernanza policéntrica, bienes comunes, diseño de mercados, procurement, regulación, legitimidad y captura. Diseño de monitoreo, métricas, auditoría, procedimientos de apelación, mantenimiento institucional y planes de transición. Cada estudiante produce una arquitectura institucional con supuestos explícitos, análisis de abusos, estrategia de implementación y defensa ante practicantes."
content_en = "Institutional diagnosis: public or private problem, stakeholders, mandates, resources, legal constraints, existing capacities, and failure modes. Design of rules, incentives, decision mechanisms, access rights, accountability, and enforcement. Polycentric governance, commons, market design, procurement, regulation, legitimacy, and capture. Monitoring design, metrics, audit, appeal procedures, institutional maintenance, and transition plans. Each student produces an institutional architecture with explicit assumptions, abuse analysis, implementation strategy, and defense before practitioners."
texts = [
  "Ostrom, Elinor. <em>Governing the Commons.</em> Cambridge University Press, 1990.",
  "Roth, Alvin E. <em>Who Gets What, and Why.</em> Houghton Mifflin Harcourt, 2015.",
  "Williamson, Oliver E. <em>The Economic Institutions of Capitalism.</em> Free Press, 1985.",
  { citation = "Simon, Herbert A. <em>The Sciences of the Artificial.</em> 3rd ed. MIT Press, 1996.", note_es = "Racionalidad limitada, satisficing, diseño como disciplina; Simon es el puente entre IA, economía y teoría organizacional.", note_en = "Bounded rationality, satisficing, design as discipline, Simon is the bridge between AI, economics, and organizational theory." },
  { citation = "Ostrom, Vincent. <em>The Intellectual Crisis in American Public Administration.</em> University of Alabama Press, 1973.", note_es = "Policentrismo: el diseño institucional no es elegir entre jerarquía y mercado, hay un tercer camino de gobernanza policéntrica.", note_en = "Polycentricity, institutional design isn't choosing between hierarchy and market; there's a third path of polycentric governance." },
]
references = [
  { name = "Elinor Ostrom Workshop, Indiana University", url = "https://ostromworkshop.indiana.edu/" },
  { name = "Santa Fe Institute Complexity and Governance", url = "https://www.santafe.edu/" },
  { name = "Oxford Blavatnik School of Government", url = "https://www.bsg.ox.ac.uk/" },
]
evaluation_primary = "PD, Public defense before external panel with practitioners"
evaluation_secondaries = [
  "TP, Institutional design document",
]

[[course]]
slug = "negociacion-persuasion-y-liderazgo"
title_es = "Negociación, Persuasión y Liderazgo"
title_en = "Negotiation, Persuasion and Leadership"
year = 3
block = "B"
position = 2
audiences = ["students", "faculty", "authorities"]
objective_es = "Lograr cosas a través de otras personas cuando no tenés autoridad e información es imperfecta."
objective_en = "To get things done through other people when you have no authority and information is imperfect."
content_es = "Negociación distributiva e integrativa, BATNA, ZOPA, anclajes, concesiones, paquetes, compromisos creíbles y puntos focales. Negociación bajo información incompleta, asimetrías de poder, coaliciones, terceros, mediación y conflictos multiparte. Persuasión escrita y oral: framing, audiencia, evidencia, autoridad, confianza y timing. Liderazgo sin autoridad formal, conducción de reuniones difíciles, desacuerdo productivo, crisis communication y decisión bajo presión. Simulaciones con debrief: qué se intentó, qué funcionó, qué señales se leyeron mal y qué se haría distinto."
content_en = "Distributive and integrative negotiation, BATNA, ZOPA, anchors, concessions, packages, credible commitments, and focal points. Negotiation under incomplete information, power asymmetries, coalitions, third parties, mediation, and multi-party conflict. Written and oral persuasion: framing, audience, evidence, authority, trust, and timing. Leadership without formal authority, running difficult meetings, productive disagreement, crisis communication, and decision under pressure. Simulations with debrief: what was attempted, what worked, which signals were misread, and what would change next time."
texts = [
  "Fisher, Roger, William Ury, and Bruce Patton. <em>Getting to Yes.</em> Penguin Books, 2011.",
  "Cialdini, Robert B. <em>Influence: The Psychology of Persuasion.</em> Harper Business, 2006.",
  { citation = "Voss, Chris. <em>Never Split the Difference.</em> Harper Business, 2016.", note_es = "La negociación como habilidad humana fundamental, técnicas de un ex negociador de rehenes del FBI, de aplicación inmediata.", note_en = "Negotiation as a fundamental human skill, techniques from a former FBI hostage negotiator, immediately practical." },
  { citation = "Schelling, Thomas C. <em>The Strategy of Conflict.</em> Harvard University Press, 1960.", note_es = "Puntos focales, compromisos creíbles, la racionalidad del comportamiento aparentemente irracional; puente entre la teoría de juegos y la negociación real.", note_en = "Focal points, credible commitments, the rationality of seemingly irrational behavior, bridge between game theory and real negotiation." },
  { citation = "Epictetus. <em>The Discourses</em> and <em>Enchiridion.</em>", note_es = "Distinguir lo que está bajo nuestro control de lo que no lo está; la compostura estoica bajo presión es la base psicológica de toda negociación efectiva.", note_en = "Distinguish what is under our control from what is not, stoic composure under pressure is the psychological foundation of all effective negotiation." },
]
references = [
  { name = "Harvard Program on Negotiation", url = "https://www.pon.harvard.edu/" },
  { name = "MIT Sloan 15.665 Power and Negotiation", url = "https://ocw.mit.edu/courses/15-665-power-and-negotiation-spring-2014/" },
  { name = "Cambridge Judge Business School Negotiation", url = "https://www.jbs.cam.ac.uk/" },
]
evaluation_primary = "LC, Live negotiation exercise with real stakes"
evaluation_secondaries = [
  "OD, Debrief and strategy analysis",
]

[[course]]
slug = "sistemas-embebidos-e-interaccion-fisica"
title_es = "Sistemas Embebidos e Interacción Física"
title_en = "Embedded Systems and Physical Interaction"
year = 3
block = "B"
position = 3
audiences = ["students", "faculty", "authorities"]
objective_es = "Construir sistemas que interactúen con el mundo físico. La materia que cierra la brecha entre el software y el hardware: sensores, actuadores, microcontroladores, comunicación en tiempo real, y las restricciones físicas que un sistema embebido impone sobre el diseño."
objective_en = "Build systems that interact with the physical world. The course that closes the gap between software and hardware: sensors, actuators, microcontrollers, real-time communication, and the physical constraints an embedded system imposes on design."
content_es = "Microcontroladores y plataformas embebidas (Arduino, ESP32, Raspberry Pi). Sensores e instrumentación, actuadores y control. Comunicación: I2C, SPI, UART, redes inalámbricas. Sistemas en tiempo real, latencia y determinismo. Restricciones físicas: consumo energético, disipación térmica, robustez electromagnética. Inferencia en el borde (edge ML) para sistemas con presupuesto computacional acotado. Conexión con la materia de Física I y con el componente físico de Studio II."
content_en = "Microcontrollers and embedded platforms (Arduino, ESP32, Raspberry Pi). Sensors and instrumentation, actuators and control. Communication: I2C, SPI, UART, wireless networks. Real-time systems, latency, and determinism. Physical constraints: power consumption, thermal dissipation, electromagnetic robustness. Edge ML for systems with bounded compute budget. Connects with Física I and the physical component of Studio II."
notes_html_es = "El programa tiene la doble sede de Ciencias Económicas e Ingeniería; la profundidad técnica en sistemas físicos forma parte de lo que la dimensión de Ingeniería compromete a entregar. La materia conecta los fundamentos físicos del Año 1 con la práctica de construir sistemas que importan en el mundo real, no solamente en el navegador."
notes_html_en = "The program is jointly hosted by Ciencias Económicas and Ingeniería; technical depth in physical systems is part of what the Engineering dimension commits to deliver. The course connects the physical foundations from Year 1 with the practice of building systems that matter in the real world, not only in the browser."
texts = [
  { citation = "Lee, Edward A., and Sanjit A. Seshia. <em>Introduction to Embedded Systems: A Cyber-Physical Systems Approach.</em> 2nd ed. MIT Press, 2017.", note_es = "El texto de referencia para sistemas ciberfísicos a nivel universitario; combina rigor formal con práctica de diseño.", note_en = "The reference text for cyber-physical systems at university level; combines formal rigor with design practice." },
  { citation = "Horowitz, Paul, and Winfield Hill. <em>The Art of Electronics.</em> 3rd ed. Cambridge University Press, 2015.", note_es = "El texto canónico de electrónica para ingenieros que necesitan diseñar circuitos reales, no solamente analizarlos.", note_en = "The canonical electronics text for engineers who need to design real circuits, not only analyze them." },
  { citation = "Warren, Henry S. <em>Hacker's Delight.</em> 2nd ed. Addison-Wesley, 2012.", note_es = "Operaciones a nivel de bits, optimización de bajo nivel; útil para programar microcontroladores con recursos limitados.", note_en = "Bit-level operations, low-level optimization; useful for programming microcontrollers with limited resources." },
  "Banzi, Massimo, and Michael Shiloh. <em>Getting Started with Arduino.</em> 3rd ed. Maker Media, 2014.",
  { citation = "Warden, Pete, and Daniel Situnayake. <em>TinyML: Machine Learning with TensorFlow Lite on Arduino and Ultra-Low-Power Microcontrollers.</em> O'Reilly, 2019.", note_es = "Inferencia de ML en microcontroladores; conecta Deep Learning con sistemas embebidos reales.", note_en = "ML inference on microcontrollers; connects Deep Learning with real embedded systems." },
]
references = [
  { name = "MIT 6.S08 Interconnected Embedded Systems", url = "https://ocw.mit.edu/courses/6-08-introduction-to-eecs-via-interconnected-embedded-systems-spring-2017/" },
  { name = "Berkeley EECS 149 Introduction to Embedded Systems", url = "https://ptolemy.berkeley.edu/projects/embedded/eecsx49/" },
  { name = "Stanford CS 149 Parallel Computing", url = "https://gfxcourses.stanford.edu/cs149/" },
  { name = "ETH Zurich Embedded Systems", url = "https://tec.ee.ethz.ch/teaching.html" },
]
evaluation_primary = "PD, Public defense of a working embedded system with documented design decisions"
evaluation_secondaries = [
  "TP, Functional prototype with hardware + firmware + measurement plan",
]

