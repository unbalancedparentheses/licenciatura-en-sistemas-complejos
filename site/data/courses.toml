[[course]]
slug = "metodos-formales-y-verificacion"
title_es = "Métodos Formales y Verificación"
title_en = "Formal Methods and Verification"
cuatrimestre = 6
position = 2
hours = [0, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Demostrar matemáticamente que un sistema hace lo que dice hacer. Si AGI genera código, la verificación formal se vuelve más importante, no menos."
objective_en = "To prove mathematically that a system does what it says it does. If AI generates code, formal verification becomes more important, not less."
content_es = "Lógica aplicada a sistemas. Especificaciones, precondiciones, postcondiciones e invariantes. Tipos, contratos y propiedades de programas. Testing versus verificación. Model checking introductorio. Pruebas asistidas por computadora. Uso introductorio de Lean 4 u otra herramienta formal para razonar sobre programas, algoritmos o estructuras matemáticas."
content_en = "Logic applied to systems. Specifications, preconditions, postconditions, and invariants. Types, contracts, and program properties. Testing versus verification. Introductory model checking. Computer-assisted proofs. Introductory use of Lean 4 or another formal tool to reason about programs, algorithms, or mathematical structures."
notes_html_es = "Se apoya en el razonamiento formal de Cálculo y Análisis y en la especificación e invariantes de Programación, Algoritmos y Sistemas de Datos. Con la IA generando código, esta disciplina se vuelve <strong>más</strong> importante, no menos."
notes_html_en = "It builds on the formal reasoning of Calculus and Analysis and on the specification and invariants of Programming, Algorithms, and Data Systems. With AI generating code, this discipline becomes <strong>more</strong> important, not less."
texts = [
  "Avigad, Jeremy. <em>Mathematics in Lean.</em> leanprover-community.github.io.",
  "Pierce, Benjamin C., et al. <em>Software Foundations.</em> softwarefoundations.cis.upenn.edu.",
  "Chlipala, Adam. <em>Certified Programming with Dependent Types.</em> MIT Press, 2013.",
]
references = [
