[[course]]
slug = "economia-politica-derecho-y-regulacion"
title_es = "Economía Política, Derecho y Regulación"
title_en = "Political Economy, Law and Regulation"
year = 2
block = "D"
position = 1
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender cómo la regulación, la tributación, la responsabilidad legal y las políticas públicas determinan lo que se puede construir."
objective_en = "To understand how regulation, taxation, legal liability, and public policy determine what can be built."
content_es = "Marcos regulatorios, regímenes de responsabilidad, estrategia de compliance, incentivos institucionales, la interacción entre derecho y arquitectura técnica. Derecho operativo para sistemas tecnológicos: protección de datos, privacidad, propiedad intelectual, licencias open-source, contratos, procurement, responsabilidad por producto, protección del consumidor, regulación de plataformas, AI governance, auditoría, reporting y compliance by design. Los estudiantes trabajan con marcos en conflicto, Hayek junto a Polanyi, Land junto a Srnicek y Williams."
content_en = "Regulatory frameworks, liability regimes, compliance strategy, institutional incentives, the interaction between law and technical architecture. Operational law for technological systems: data protection, privacy, intellectual property, open-source licensing, contracts, procurement, product liability, consumer protection, platform regulation, AI governance, audit, reporting, and compliance by design. Students work with conflicting frameworks, Hayek alongside Polanyi, Land alongside Srnicek and Williams."
texts = [
  "Acemoglu, Daron, and James A. Robinson. <em>The Narrow Corridor.</em> Penguin Press, 2019.",
  "Lessig, Lawrence. <em>Code: And Other Laws of Cyberspace.</em> Basic Books, 1999.",
  "Tirole, Jean. <em>Economics for the Common Good.</em> Princeton University Press, 2017.",
  { citation = "Polanyi, Karl. <em>The Great Transformation.</em> Beacon Press, 1944.", note_es = "El mercado no es natural, fue construido políticamente. Contrapunto imprescindible a Hayek.", note_en = "The market is not natural, it was politically constructed. Essential counterpoint to Hayek." },
  "Zuboff, Shoshana. <em>The Age of Surveillance Capitalism.</em> PublicAffairs, 2019.",
  { citation = "Land, Nick. Selections from <em>Fanged Noumena.</em> Urbanomic, 2011.", note_es = "Aceleracionismo, la inteligencia como proceso que excede lo humano, el capital como IA <em>avant la lettre</em>, leído como objeto de análisis, no como doctrina.", note_en = "Accelerationism, intelligence as a process exceeding the human, capital as AI <em>avant la lettre</em>, taught as object of analysis, not doctrine." },
  { citation = "Srnicek, Nick, and Alex Williams. <em>Inventing the Future.</em> Verso, 2015.", note_es = "Toma las premisas de Land y las gira hacia la izquierda; el contraste es pedagógicamente potente.", note_en = "Take Land's premises and turn them leftward, the contrast is pedagogically potent." },
  { citation = "Brown, Wendy. <em>Undoing the Demos.</em> Zone Books, 2015.", note_es = "El neoliberalismo como racionalidad que convierte todo en lógica de mercado, incluidas la política y la subjetividad.", note_en = "Neoliberalism as a rationality that converts everything into market logic, including politics and subjectivity." },
  { citation = "Davidson, James Dale, and William Rees-Mogg. <em>The Sovereign Individual.</em> Touchstone, 1997.", note_es = "Predijo en 1997 cómo la tecnología iba a desplazar el poder entre individuos y estados; el marco sigue siendo notablemente útil para analizar las dinámicas actuales.", note_en = "Predicted in 1997 how technology would shift power between individuals and states, the framework remains remarkably useful for analyzing current dynamics." },
]
references = [
  { name = "MIT 14.42 Environmental Policy and Economics", url = "https://ocw.mit.edu/courses/14-42-environmental-policy-and-economics-spring-2011/" },
  { name = "Stanford Law and Technology", url = "https://law.stanford.edu/courses/" },
  { name = "Oxford PPE Politics and Philosophy components", url = "https://www.ppe.ox.ac.uk/" },
]
