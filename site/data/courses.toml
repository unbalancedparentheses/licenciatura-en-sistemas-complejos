[[course]]
slug = "procesos-estocasticos-y-riesgo"
title_es = "Procesos Estocásticos y Riesgo"
title_en = "Stochastic Processes and Risk"
year = 2
block = "B"
position = 2
audiences = ["students", "faculty", "authorities"]
objective_es = "Modelar procesos dependientes del camino, detectar no-ergodicidad, identificar escenarios de ruina. Entender por qué las métricas convencionales de riesgo fallan en dominios de colas gruesas."
objective_en = "To model path-dependent processes, detect non-ergodicity, and identify ruin scenarios. To understand why conventional risk metrics fail catastrophically in fat-tailed domains."
content_es = "Cadenas de Markov, caminatas aleatorias, procesos de Poisson, movimiento browniano. Distribuciones de colas gruesas, el problema de la ergodicidad, criterio de Kelly, dinámica de Cisne Negro. La segunda mitad trata las fat tails como el argumento central."
content_en = "Markov chains, random walks, Poisson processes, Brownian motion. Fat-tailed distributions, the ergodicity problem, Kelly criterion, Black Swan dynamics. The second half treats fat tails as the central argument, not an appendix."
notes_html_es = "La integración de las fat tails no es un apéndice, es el argumento central de la segunda mitad de la materia. Se conecta directamente con Biología (el colapso ecológico es un evento de cola gruesa), Física (termodinámica de sistemas lejos del equilibrio) y Epistemología (el problema de la inducción es la preocupación filosófica central de Taleb)."
notes_html_en = "The integration of fat tails is not an appendix, it is the central argument of the second half of the course. Connects directly with Biology (ecological collapse is a fat-tailed event), Physics (thermodynamics of far-from-equilibrium systems), and Epistemology (the problem of induction is Taleb's central philosophical concern)."
texts = [
  "Ross, Sheldon M. <em>Introduction to Probability Models.</em> 12th ed. Academic Press, 2019.",
  "Taleb, Nassim Nicholas. <em>Statistical Consequences of Fat Tails.</em> STEM Academic Press, 2020.",
  "Norris, J. R. <em>Markov Chains.</em> Cambridge University Press, 1997.",
  { citation = "Peters, Ole, and London Mathematical Laboratory papers on ergodicity.", note_es = "La distinción entre promedios de ensemble y promedios temporales: si un proceso es no ergódico, el promedio del grupo no describe la experiencia del individuo, lo que cambia de raíz cómo deben analizarse el riesgo, la desigualdad y las decisiones.", note_en = "The distinction between ensemble averages and time averages, if a process is non-ergodic, the average across the group does not describe the experience of the individual, which fundamentally changes how risk, inequality, and decisions should be analyzed." },
  { citation = "Cirillo, Pasquale, and Nassim Nicholas Taleb. <em>The Logic of Risk</em> and joint papers on fat tails, wars, and pandemics.", note_es = "Formalización estadística rigurosa del marco de fat tails con implicancias directas para política pública y gestión del riesgo.", note_en = "Rigorous statistical formalization of the fat-tails framework with direct implications for policy and risk management." },
]
references = [
  { name = "Stanford MS&E 221 Stochastic Modeling", url = "https://explorecourses.stanford.edu/search?q=MS%26E+221" },
  { name = "MIT 6.7700 Discrete Stochastic Processes", url = "https://ocw.mit.edu/courses/6-262-discrete-stochastic-processes-spring-2011/" },
  { name = "London Mathematical Laboratory: Ergodicity Economics", url = "https://ergodicityeconomics.com/" },
  { name = "Nassim Taleb's Real World Risk Institute", url = "https://www.realworldrisk.com/" },
]
evaluation_primary = "WE, Written exam"
evaluation_secondaries = [
  "OD, Defense of risk analysis",
]

