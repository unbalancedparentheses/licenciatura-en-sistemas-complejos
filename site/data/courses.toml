objective_en = "To develop the capacity for abstract mathematical reasoning — to recognize structure, construct proofs in unfamiliar territory, and think beyond computation."
content_es = "Combinatoria y argumentos de conteo (funciones generatrices, principio del palomar, método probabilístico). Estructuras algebraicas (grupos, anillos, cuerpos, aritmética modular — los fundamentos de la criptografía). Ideas seleccionadas de topología y análisis (continuidad como preservación de estructura, compacidad, teoremas de punto fijo). Cada tema se desarrolla con demostraciones completas y conjuntos de problemas."
content_en = "Combinatorics and counting arguments (generating functions, pigeonhole principle, probabilistic method). Algebraic structures (groups, rings, fields, modular arithmetic — the foundations of cryptography). Selected ideas from topology and analysis (continuity as structure preservation, compactness, fixed-point theorems). Each topic is developed with complete proofs and problem sets."
notes_html = "The goal is mathematical maturity: the ability to read a proof in an unfamiliar domain, identify the key idea, and adapt the technique. Students who complete this course can follow the mathematical arguments of any later course — stochastic processes, information theory, cryptography, mechanism design — without being stopped by unfamiliar abstractions. Connects directly with Razonamiento Formal y Demostración (which provides the proof toolkit), Seguridad y Criptografía (where group theory becomes operational), Métodos Formales (where abstract structures appear in Lean 4), and Información, Señales y Comunicación."
texts = [
