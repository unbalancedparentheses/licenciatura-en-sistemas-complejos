position = 2
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender cómo las organizaciones, los estados, los mercados y las tecnologías transformadoras realmente funcionan, y cómo fallan. Casos históricos como tests de estrés de modelos de gobernanza, junto al estudio de cómo cada gran transición tecnológica reorganizó el poder, la economía y las formas de vida."
objective_en = "To understand how organizations, states, markets, and transformative technologies actually work, and how they fail. Historical cases as stress tests of governance models, together with the study of how each major technological transition reorganized power, economy, and forms of life."
content_es = "Primera mitad, instituciones: modos de falla institucional y sus causas estructurales. Por qué colapsan los imperios, por qué los regímenes regulatorios se calcifican, por qué organizaciones efectivas se vuelven patológicas. Segunda mitad, tecnología como motor de cambio: la imprenta, la máquina de vapor, la electricidad, la computadora, internet, la IA. Cómo cada tecnología cambió qué tipos de organizaciones son posibles, quién tiene poder, y qué formas de vida se vuelven imaginables."
content_en = "First half, institutions: institutional failure modes and their structural causes. Why empires collapse, why regulatory regimes calcify, why effective organizations become pathological. Second half, technology as engine of change: the printing press, steam engine, electricity, computer, internet, AI. How each technology changed what kinds of organizations are possible, who holds power, and what forms of life become imaginable."
texts = [
  "Acemoglu, Daron, and James A. Robinson. <em>Why Nations Fail.</em> Crown, 2012.",
  "North, Douglass C. <em>Institutions, Institutional Change and Economic Performance.</em> Cambridge University Press, 1990.",
  "Scott, James C. <em>Seeing Like a State.</em> Yale University Press, 1998.",
  "Hirschman, Albert O. <em>Exit, Voice, and Loyalty.</em> Harvard University Press, 1970.",
  "Olson, Mancur. <em>The Logic of Collective Action.</em> Harvard University Press, 1965.",
  "Dalio, Ray. <em>Principles for Dealing with the Changing World Order.</em> Simon & Schuster, 2021.",
  { citation = "Hobsbawm, Eric. <em>The Age of Revolution</em>, <em>The Age of Capital</em>, <em>The Age of Empire</em>. Vintage, 1962–1987.", note_es = "La trilogía 1789–1914, andamiaje histórico para entender cómo la doble revolución dio forma al mundo moderno.", note_en = "The 1789–1914 trilogy, historical scaffolding for understanding how the modern world was formed by the dual revolution." },
  { citation = "Mokyr, Joel. <em>The Lever of Riches.</em> Oxford University Press, 1990.", note_es = "La creatividad tecnológica y el progreso económico como fuerzas históricas.", note_en = "Technological creativity and economic progress as historical forces." },
  { citation = "Chandler, Alfred D. <em>The Visible Hand.</em> Harvard University Press, 1977.", note_es = "La revolución gerencial y cómo las organizaciones se volvieron la forma dominante de coordinación.", note_en = "The managerial revolution and how organizations became the dominant form of coordination." },
  { citation = "Perez, Carlota. <em>Technological Revolutions and Financial Capital.</em> Edward Elgar, 2002.", note_es = "Teoría de los ciclos largos de tecnología, capital y ajuste institucional.", note_en = "Long-cycle theory of technology, capital, and institutional adjustment." },
  "Brynjolfsson, Erik, and Andrew McAfee. <em>The Second Machine Age.</em> W. W. Norton, 2014.",
]
