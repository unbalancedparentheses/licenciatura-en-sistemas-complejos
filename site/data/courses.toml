# Courses of the 8-cuatrimestre plan. `hours` = weekly hours in [B1, B2]
# (first and second bimestre of the cuatrimestre); each bimestre is 8 weeks.
# Talleres live in talleres.toml.

[[course]]
slug = "algebra-lineal-y-computacion-i"
title_es = "Álgebra Lineal y Computación I"
title_en = "Linear Algebra and Computation I"
cuatrimestre = 1
position = 1
hours = [6, 0]
audiences = ["students", "faculty", "authorities"]
objective_es = "Construir la columna vertebral matemática del programa. El álgebra lineal es el lenguaje de los datos, el machine learning, la optimización y el razonamiento cuantitativo. Los estudiantes que no la dominen encontrarán un techo en cada materia cuantitativa que sigue."
objective_en = "To build the mathematical backbone of the program. Linear algebra is the language of data, machine learning, optimization, and quantitative reasoning. Students who do not master it at depth will hit a ceiling in every quantitative course that follows."
content_es = "Vectores, matrices y sistemas lineales. Espacios vectoriales, independencia lineal, bases y dimensión. Transformaciones lineales. Producto interno, ortogonalidad y proyecciones. Factorizaciones básicas. Interpretación geométrica y computacional. Aplicaciones a datos, modelos, gráficos y optimización."
content_en = "Vectors, matrices, and linear systems. Vector spaces, linear independence, bases, and dimension. Linear transformations. Inner product, orthogonality, and projections. Basic factorizations. Geometric and computational interpretation. Applications to data, models, graphics, and optimization."
texts = [
  "Strang, Gilbert. <em>Linear Algebra and Learning from Data.</em> Wellesley-Cambridge Press, 2019.",
  "Strang, Gilbert. <em>Introduction to Linear Algebra.</em> 6th ed. Wellesley-Cambridge Press, 2023.",
  "Axler, Sheldon. <em>Linear Algebra Done Right.</em> 4th ed. Springer, 2024.",
]
references = [
  { name = "MIT 18.06 Linear Algebra", url = "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/" },
  { name = "MIT 18.065 Matrix Methods in Data Analysis", url = "https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/" },
  { name = "Imperial College Mathematics for Machine Learning, Coursera", url = "https://www.coursera.org/specializations/mathematics-machine-learning" },
  { name = "3Blue1Brown: Essence of Linear Algebra, YouTube", url = "https://www.3blue1brown.com/topics/linear-algebra" },
]
evaluation_primary = "WE, Written Exam"
evaluation_secondaries = [
  "TP, Weekly problem sets",
]

[[course]]
slug = "calculo-y-analisis-i"
title_es = "Cálculo y Análisis I"
title_en = "Calculus and Analysis I"
cuatrimestre = 1
position = 2
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Construir el cálculo de una variable con rigor, el que el resto del programa asume en silencio. Desde límites y continuidad hasta integración y series, con el rigor de ε–δ suficiente para que probabilidad, física y los cursos cuantitativos puedan apoyarse en él en lugar de evitarlo. Es la primera mitad de la secuencia Ma 1 de Caltech (18.01 del MIT)."
objective_en = "To build single-variable calculus rigorously, the calculus the rest of the program silently assumes. From limits and continuity to integration and series, with enough ε–δ rigor that probability, physics, and the quantitative courses can rely on it rather than work around it. It is the first half of Caltech's Ma 1 sequence (MIT 18.01)."
content_es = "Funciones de una variable. Límites, continuidad y derivadas. Teoremas fundamentales del cálculo diferencial. Integración definida e indefinida. Series y aproximaciones. Introducción al razonamiento formal con definiciones. Aplicaciones a cambio, crecimiento, física y modelos simples."
content_en = "Functions of one variable. Limits, continuity, and derivatives. Fundamental theorems of differential calculus. Definite and indefinite integration. Series and approximations. Introduction to formal reasoning with definitions. Applications to change, growth, physics, and simple models."
notes_html_es = "Primera de dos materias de cálculo. Separar el cálculo de una variable (esta) del cálculo en varias variables (Cálculo y Análisis II, 2.º cuatrimestre) es lo que permite tratar cada uno con la profundidad de Caltech. Incluye la introducción al razonamiento formal con definiciones que el resto de la secuencia matemática asume."
notes_html_en = "First of two calculus courses. Separating single-variable calculus (this one) from multivariable calculus (Calculus and Analysis II, 2nd cuatrimestre) is what allows each to be treated with Caltech's depth. It includes the introduction to formal reasoning with definitions that the rest of the mathematics sequence assumes."
texts = [
  { citation = "Spivak, Michael. <em>Calculus.</em> 4th ed. Publish or Perish, 2008.", note_es = "Cálculo de una variable tratado con rigor, escrito como introducción al análisis real.", note_en = "Single-variable calculus treated rigorously, written as an introduction to real analysis." },
  { citation = "Apostol, Tom M. <em>Calculus.</em> Vol. I. 2nd ed. Wiley, 1967.", note_es = "El texto canónico del núcleo de matemática de Caltech: cálculo construido con rigor.", note_en = "The canonical text of Caltech's mathematics core: calculus built rigorously." },
  { citation = "Tao, Terence. <em>Analysis I.</em> Hindustan Book Agency, 2016.", note_es = "Análisis real construido desde los axiomas de los reales, autocontenido y riguroso.", note_en = "Real analysis built from the axioms of the reals, self-contained and rigorous." },
]
references = [
  { name = "MIT 18.01 Single Variable Calculus", url = "https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/" },
  { name = "Caltech Ma 1abc Mathematics", url = "https://pma.caltech.edu/courses" },
]
evaluation_primary = "WE, Written exam with unseen problems and short proofs"
evaluation_secondaries = [
  "TP, Weekly problem sets and proof exercises",
]

[[course]]
slug = "biologia"
title_es = "Biología de Sistemas, Evolución y Ecología"
title_en = "Systems Biology, Evolution, and Ecology"
cuatrimestre = 1
position = 3
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Estudiar sistemas vivos como sistemas adaptativos complejos: evolución, ecología, redes regulatorias, inmunidad, epidemias, robustez y fragilidad. La materia no es una introducción genérica a la biología sino una lente para entender adaptación, selección, feedback, coevolución, colapso ecológico y optimización bajo restricciones."
objective_en = "To study living systems as complex adaptive systems: evolution, ecology, regulatory networks, immunity, epidemics, robustness, and fragility. This is not a generic introduction to biology but a lens for understanding adaptation, selection, feedback, coevolution, ecological collapse, and optimization under constraints."
content_es = "Evolución por selección natural. Adaptación, robustez y fragilidad. Redes regulatorias, homeostasis y feedback biológico. Ecología de poblaciones y comunidades. Coevolución, cooperación, competencia y simbiosis. Epidemiología básica. Sistemas inmunes. Analogías biológicas usadas con cuidado en tecnología, instituciones e IA."
content_en = "Evolution by natural selection. Adaptation, robustness, and fragility. Regulatory networks, homeostasis, and biological feedback. Population and community ecology. Coevolution, cooperation, competition, and symbiosis. Basic epidemiology. Immune systems. Biological analogies used with care in technology, institutions, and AI."
notes_html_es = "El objetivo es que los estudiantes incorporen un dominio de complejidad que no fue diseñado por humanos. Física enseña leyes, restricciones y conservación; biología enseña adaptación, falla, selección y supervivencia bajo condiciones cambiantes. La materia exige modelos, estimaciones y diagramas causales, no memorización taxonómica ni una orientación pre-médica."
notes_html_en = "The goal is for students to internalize a domain of complexity not designed by humans. Physics teaches laws, constraints, and conservation; biology teaches adaptation, failure, selection, and survival under changing conditions. The course requires models, estimates, and causal diagrams, not taxonomic memorization or a pre-medical orientation."
texts = [
  "Carroll, Sean B. <em>The Serengeti Rules.</em> Princeton University Press, 2016.",
  "Maynard Smith, John. <em>Evolution and the Theory of Games.</em> Cambridge University Press, 1982.",
  "Nowak, Martin A. <em>Evolutionary Dynamics: Exploring the Equations of Life.</em> Belknap Press, 2006.",
  "Levin, Simon A. <em>Fragile Dominion: Complexity and the Commons.</em> Perseus Books, 1999.",
  { citation = "Alberts, Bruce, et al. <em>Essential Cell Biology.</em> 5th ed. W. W. Norton, 2019.", note_es = "Referencia de consulta para mecanismos celulares, no columna vertebral de la materia.", note_en = "Reference for cellular mechanisms, not the backbone of the course." },
  "Dawkins, Richard. <em>The Selfish Gene.</em> 40th Anniversary ed. Oxford University Press, 2016.",
]
references = [
  { name = "MIT 7.013 Introductory Biology", url = "https://ocw.mit.edu/courses/7-013-introductory-biology-spring-2018/" },
  { name = "MIT 7.91J Foundations of Computational and Systems Biology", url = "https://ocw.mit.edu/courses/7-91j-foundations-of-computational-and-systems-biology-spring-2014/" },
  { name = "Caltech Bi 1 Principles of Biology", url = "https://catalog.caltech.edu/current/courses/department/Bi" },
  { name = "École Polytechnique tronc commun Biologie", url = "https://programmes.polytechnique.edu/cycle-ingenieur-polytechnicien/cycle-ingenieur-polytechnicien-program/academics" },
]
evaluation_primary = "OD, Defense of analysis of a biological system"
evaluation_secondaries = [
  "TP, Quantitative analysis with estimates and models",
]

[[course]]
slug = "historia-de-las-instituciones-la-tecnologia-y-el-poder"
title_es = "Historia de las Instituciones, la Tecnología y el Poder"
title_en = "History of Institutions, Technology, and Power"
cuatrimestre = 1
position = 4
hours = [0, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender cómo las organizaciones, los estados, los mercados y las tecnologías transformadoras realmente funcionan, y cómo fallan. Casos históricos como tests de estrés de modelos de gobernanza, junto al estudio de cómo cada gran transición tecnológica reorganizó el poder, la economía y las formas de vida."
objective_en = "To understand how organizations, states, markets, and transformative technologies actually work, and how they fail. Historical cases as stress tests of governance models, together with the study of how each major technological transition reorganized power, economy, and forms of life."
content_es = "Formación histórica de Estados, burocracias, empresas, mercados e infraestructuras. Tecnología y transformación institucional. Poder político, económico y técnico. Revoluciones industriales, guerra, administración pública, ciencia organizada y plataformas. Dependencia de camino, continuidad, ruptura y cambio tecnológico."
content_en = "Historical formation of states, bureaucracies, firms, markets, and infrastructures. Technology and institutional transformation. Political, economic, and technical power. Industrial revolutions, war, public administration, organized science, and platforms. Path dependence, continuity, rupture, and technological change."
