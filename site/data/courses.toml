objective_es = "Dominar la escritura analítica y argumentativa en español. Para personas que operarán en América Latina, la capacidad de escribir con precisión en español no es secundaria, es central."
objective_en = "To master analytical and argumentative writing in Spanish. For people who will operate in Latin America, the ability to write precisely in Spanish is not secondary, it is central."
content_es = "Ensayo analítico, memo ejecutivo, nota técnica, informe institucional, discurso breve, columna pública y explicación para audiencias no especialistas. Estructura argumental, tesis, evidencia, ritmo, precisión léxica, traducción conceptual entre jerga técnica y español público, edición línea por línea y reescritura profunda. Uso de IA para borradores, contraargumentos y edición, con responsabilidad completa del autor. El portfolio exige varias versiones de un mismo texto, registro de decisiones editoriales y defensa oral de estilo, estructura y evidencia."
content_en = "Analytical essay, executive memo, technical note, institutional report, short speech, public column, and explanation for non-specialist audiences. Argument structure, thesis, evidence, rhythm, lexical precision, conceptual translation between technical jargon and public Spanish, line editing, and deep revision. AI use for drafts, counterarguments, and editing, with full authorial responsibility. The portfolio requires multiple versions of the same text, an editorial decision log, and oral defense of style, structure, and evidence."
texts = [
