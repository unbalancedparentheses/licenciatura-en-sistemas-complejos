objective_en = "To design institutions that survive contact with real people. The course where students synthesize mechanism design, organizational theory, political economy, and legal reasoning into institutional architecture."
content_es = "Diagnóstico de un problema real. Diseño de arquitectura institucional, mecanismos de decisión, incentivos, procedimientos, métricas y gobernanza. Interacción con actores externos. Evaluación de viabilidad política, legal, operativa y presupuestaria. Propuesta defendida ante practicantes."
