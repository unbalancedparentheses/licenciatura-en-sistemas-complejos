[[course]]
slug = "probabilidad-y-estadistica"
title_es = "Probabilidad y Estadística"
title_en = "Probability and Statistics"
cuatrimestre = 3
position = 2
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Razonar rigurosamente sobre incertidumbre, evidencia e inferencia. La base cuantitativa que sostiene ML, econometría, procesos estocásticos y toda decisión bajo incertidumbre."
objective_en = "To reason rigorously about uncertainty, evidence, and inference. The quantitative foundation on which ML, econometrics, stochastic processes, and every decision under uncertainty rests."
content_es = "Espacios de probabilidad. Variables aleatorias, distribuciones, esperanza y varianza. Independencia, condicionalidad y Bayes. Ley de los grandes números y teorema central del límite. Estimación, intervalos, tests de hipótesis, regresión básica, simulación e inferencia. Lectura crítica de evidencia cuantitativa."
content_en = "Probability spaces. Random variables, distributions, expectation, and variance. Independence, conditioning, and Bayes. Law of large numbers and central limit theorem. Estimation, intervals, hypothesis tests, basic regression, simulation, and inference. Critical reading of quantitative evidence."
texts = [
  "Blitzstein, Joseph K., and Jessica Hwang. <em>Introduction to Probability.</em> 2nd ed. CRC Press, 2019.",
  "Wasserman, Larry. <em>All of Statistics.</em> Springer, 2004.",
  "Jaynes, Edwin T. <em>Probability Theory: The Logic of Science.</em> Cambridge University Press, 2003.",
]
references = [
  { name = "MIT 6.3700 Introduction to Probability", url = "https://ocw.mit.edu/courses/6-041sc-probabilistic-systems-analysis-and-applied-probability-fall-2013/" },
  { name = "MIT 18.650 Fundamentals of Statistics", url = "https://ocw.mit.edu/courses/18-650-statistics-for-applications-fall-2016/" },
  { name = "Stanford CS 109 Probability for Computer Scientists", url = "https://web.stanford.edu/class/cs109/" },
  { name = "Caltech Ma 3", url = "https://catalog.caltech.edu/current/courses/department/Ma" },
]
evaluation_primary = "WE, Written exam"
evaluation_secondaries = [
  "TP, Weekly problem sets",
]

[[course]]
slug = "ecuaciones-diferenciales-y-sistemas-dinamicos"
title_es = "Ecuaciones Diferenciales y Sistemas Dinámicos"
title_en = "Differential Equations and Dynamical Systems"
cuatrimestre = 3
position = 3
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Dar el lenguaje de los sistemas que evolucionan en el tiempo: ecuaciones diferenciales, estabilidad y comportamiento cualitativo. Es la materia bisagra del núcleo, el equivalente a Ma 2 de Caltech y a 18.03 del MIT, y la base sobre la que se apoyan Sistemas Complejos y Control. Razonar sobre dinámica antes de intentar controlarla o simularla."
objective_en = "To provide the language of systems that evolve over time: differential equations, stability, and qualitative behavior. It is the hinge course of the core, the equivalent of Caltech's Ma 2 and MIT's 18.03, and the base on which Complex Systems and Control rest. Reason about dynamics before trying to control or simulate it."
content_es = "Ecuaciones diferenciales ordinarias. Sistemas lineales y no lineales. Equilibrio, estabilidad, oscilaciones y bifurcaciones. Dinámica discreta. Modelos de crecimiento, epidemias, control, física y economía. Simulación numérica y análisis cualitativo de sistemas que evolucionan en el tiempo."
content_en = "Ordinary differential equations. Linear and nonlinear systems. Equilibrium, stability, oscillations, and bifurcations. Discrete dynamics. Models of growth, epidemics, control, physics, and economics. Numerical simulation and qualitative analysis of systems that evolve over time."
notes_html_es = "Es deliberadamente una materia de segundo año. Caltech la coloca en el segundo año (Ma 2) y el MIT como gate temprano (18.03) precisamente porque Control y los sistemas complejos no se pueden enseñar con honestidad sin ella. Se apoya en Cálculo y Análisis I y II y alimenta directamente Sistemas Complejos (4.º cuatrimestre) y Control, Observabilidad y Medición (5.º cuatrimestre)."
notes_html_en = "It is deliberately a second-year course. Caltech places it in the second year (Ma 2) and MIT as an early gate (18.03) precisely because control and complex systems cannot be taught honestly without it. It rests on Calculus and Analysis I and II and feeds directly into Complex Systems (4th cuatrimestre) and Control, Observability and Measurement (5th cuatrimestre)."
texts = [
  "Strogatz, Steven H. <em>Nonlinear Dynamics and Chaos.</em> 2nd ed. CRC Press, 2014.",
  "Hirsch, Morris W., Stephen Smale, and Robert L. Devaney. <em>Differential Equations, Dynamical Systems, and an Introduction to Chaos.</em> 3rd ed. Academic Press, 2012.",
  "Boyce, William E., and Richard C. DiPrima. <em>Elementary Differential Equations and Boundary Value Problems.</em> 12th ed. Wiley, 2021.",
]
references = [
  { name = "MIT 18.03 Differential Equations", url = "https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/" },
  { name = "Caltech Ma 2 / Ma 102 Differential Equations", url = "https://pma.caltech.edu/courses" },
  { name = "MIT 18.353 Nonlinear Dynamics and Chaos", url = "https://ocw.mit.edu/courses/18-353j-nonlinear-dynamics-i-chaos-fall-2012/" },
  { name = "Steven Strogatz: Nonlinear Dynamics and Chaos lectures, YouTube", url = "https://www.youtube.com/playlist?list=PLbN57C5Zdl6j_qJA-pARJnKsmROzPnO9V" },
]
evaluation_primary = "WE, Written exam with unseen problems"
evaluation_secondaries = [
  "TP, Problem sets and a phase-portrait modeling project",
]

[[course]]
slug = "epistemologia-etica-y-los-limites-de-la-ia"
title_es = "Epistemología, Ética y los límites de la IA"
title_en = "Epistemology, Ethics, and the Limits of AI"
cuatrimestre = 3
position = 4
hours = [0, 6]
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender qué cuenta como conocimiento, qué hace válido a un modelo, qué pueden y no pueden hacer las máquinas y cómo razonar sobre las obligaciones de quien construye sistemas que afectan a otros. La materia que examina la afirmación fundacional del programa: que la IA todavía no puede ser confiada con el juicio."
objective_en = "Understand what counts as knowledge, what makes a model valid, what machines can and cannot do, and how to reason about the obligations of those who build systems that affect others. The course that examines the program's founding claim: that AI cannot yet be trusted with judgment."
content_es = "Conocimiento científico, explicación, predicción, modelos e idealización. Falsación, paradigmas, realismo e instrumentalismo. Límites de inferencia automatizada. Interpretabilidad, sesgo, alucinación, evaluación, alineamiento y validez en sistemas de IA. Diferencia entre correlación, explicación, comprensión y juicio."
content_en = "Scientific knowledge, explanation, prediction, models, and idealization. Falsification, paradigms, realism, and instrumentalism. Limits of automated inference. Interpretability, bias, hallucination, evaluation, alignment, and validity in AI systems. The difference between correlation, explanation, understanding, and judgment."
notes_html_es = "La filosofía de la ciencia no es abstracta, es operativa para quienes construyen sistemas. La materia se ancla en cuatro lecturas centrales: Kuhn sobre cómo cambian los paradigmas, el debate Dreyfus–Dennett sobre qué es la inteligencia, Cartwright sobre la idealización en los modelos científicos, y Russell sobre el problema del alineamiento. Esos cuatro ejes estructuran el curso; los demás autores aparecen como ampliación o referencia, no como lectura paralela. Conecta directamente con Métodos Formales (Lakatos), Machine Learning (Cartwright sobre modelos) y Sistemas Complejos (Polanyi sobre conocimiento tácito)."
notes_html_en = "Philosophy of science is not abstract, it is operational for those who build systems. The course anchors on four core readings: Kuhn on how paradigms change, the Dreyfus–Dennett debate on what intelligence is, Cartwright on idealization in scientific models, and Russell on the alignment problem. Those four are the structural spine of the course; other authors appear as extensions or references, not as parallel reading. Connects directly with Métodos Formales (Lakatos), Machine Learning (Cartwright on models), and Sistemas Complejos (Polanyi on tacit knowledge)."
texts = [
  "Kuhn, Thomas S. <em>The Structure of Scientific Revolutions.</em> 4th ed. University of Chicago Press, 2012.",
  { citation = "Dreyfus, Hubert L. <em>What Computers Can't Do.</em> Harper & Row, 1972.", note_es = "Lectura central. La crítica fenomenológica más potente de la IA; tuvo razón sobre la GOFAI y sus argumentos sobre la corporalidad siguen sin resolución por parte de los LLMs.", note_en = "Core reading. The most powerful phenomenological critique of AI, was right about GOFAI, his arguments about embodiment remain unresolved by LLMs." },
  { citation = "Dennett, Daniel C. <em>Consciousness Explained.</em> Little, Brown, 1991.", note_es = "Lectura central. La posición funcionalista / deflacionaria, contrapunto directo a Dreyfus; el debate Dreyfus–Dennett es el eje central de la filosofía de la IA.", note_en = "Core reading. The functionalist / deflationary position, direct counterpoint to Dreyfus; the Dreyfus–Dennett debate is the central axis of philosophy of AI." },
  { citation = "Cartwright, Nancy. <em>How the Laws of Physics Lie.</em> Oxford University Press, 1983.", note_es = "Lectura central. Los modelos idealizan, no describen; lectura clave para quienes construyen modelos de ML.", note_en = "Core reading. Models idealize, they don't describe, crucial for ML builders." },
  { citation = "Russell, Stuart. <em>Human Compatible.</em> Viking, 2019.", note_es = "Lectura central. El problema del alineamiento por uno de los fundadores del campo: por qué las máquinas que optimizan objetivos mal especificados son peligrosas.", note_en = "Core reading. The alignment problem from a founder of the field, why machines optimizing misspecified objectives are dangerous." },
  "Jonas, Hans. <em>The Imperative of Responsibility.</em> University of Chicago Press, 1984.",
  "MacIntyre, Alasdair. <em>After Virtue.</em> 3rd ed. University of Notre Dame Press, 2007.",
]
references = [
  { name = "Stanford Symbolic Systems Program", url = "https://symsys.stanford.edu/" },
  { name = "Stanford Phil 80 Mind, Matter, and Meaning", url = "https://explorecourses.stanford.edu/search?q=PHIL+80" },
  { name = "MIT 24.09 Minds and Machines", url = "https://ocw.mit.edu/courses/24-09-minds-and-machines-fall-2011/" },
  { name = "Oxford Philosophy of Mind", url = "https://www.philosophy.ox.ac.uk/" },
  { name = "Cambridge HPS", url = "https://www.hps.cam.ac.uk/" },
  { name = "Oxford Practical Ethics", url = "https://www.practicalethics.ox.ac.uk/" },
  { name = "Harvard Kennedy School Ethics and Public Policy", url = "https://www.hks.harvard.edu/educational-programs/courses" },
  { name = "Oxford PPE Philosophy component", url = "https://www.ppe.ox.ac.uk/" },
]
evaluation_primary = "OD, Defense of philosophical analysis of a real AI system"
evaluation_secondaries = [
  "TP, Written analysis",
]

[[course.extra_section]]
label_es = "Lecturas secundarias"
label_en = "Secondary readings"
html_es = "<p>Extractos seleccionados, no lectura completa:</p>\n<ul>\n  <li>Lakatos, <em>Proofs and Refutations</em>: cómo funciona la matemática como actividad humana; conecta con Métodos Formales.</li>\n  <li>Polanyi, <em>Personal Knowledge</em>: conocimiento tácito y lo que un experto sabe pero no puede formalizar.</li>\n  <li>Christian, <em>The Alignment Problem</em>: historia reciente del problema del alineamiento.</li>\n  <li>Feyerabend, <em>Against Method</em>: anarquismo epistemológico, complemento crítico a Kuhn.</li>\n</ul>\n"
html_en = "<p>Selected excerpts, not full reading:</p>\n<ul>\n  <li>Lakatos, <em>Proofs and Refutations</em>: how mathematics works as human activity; connects with Métodos Formales.</li>\n  <li>Polanyi, <em>Personal Knowledge</em>: tacit knowledge and what an expert knows but cannot formalize.</li>\n  <li>Christian, <em>The Alignment Problem</em>: recent history of the alignment problem.</li>\n  <li>Feyerabend, <em>Against Method</em>: epistemological anarchism, critical complement to Kuhn.</li>\n</ul>\n"

[[course.extra_section]]
label_es = "Lecturas complementarias"
label_en = "Further reading"
html_es = "<p>Disponibles para profundización individual o trabajos de los Talleres Integradores:</p>\n<ul>\n  <li>Hacking, <em>Representing and Intervening</em></li>\n  <li>Latour, <em>Science in Action</em></li>\n  <li>Hui, <em>The Question Concerning Technology in China</em></li>\n  <li>Simondon, <em>On the Mode of Existence of Technical Objects</em></li>\n  <li>Haraway, <em>Cyborg Manifesto</em></li>\n  <li>Bostrom, <em>Superintelligence</em></li>\n</ul>\n"
html_en = "<p>Available for individual depth or Integrative Taller projects:</p>\n<ul>\n  <li>Hacking, <em>Representing and Intervening</em></li>\n  <li>Latour, <em>Science in Action</em></li>\n  <li>Hui, <em>The Question Concerning Technology in China</em></li>\n  <li>Simondon, <em>On the Mode of Existence of Technical Objects</em></li>\n  <li>Haraway, <em>Cyborg Manifesto</em></li>\n  <li>Bostrom, <em>Superintelligence</em></li>\n</ul>\n"

