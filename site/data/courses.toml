title_en = "Geopolitics, Technology, and the International System"
cuatrimestre = 6
position = 4
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender cómo la tecnología redistribuye el poder entre países y cómo la competencia entre potencias restringe lo que se puede construir. Quien crea sistemas o empresas desde la Argentina opera dentro de cadenas de suministro, estándares, sanciones y dependencias que se deciden en otro lugar; esta materia enseña a leerlas y a pensar estratégicamente desde una posición periférica."
objective_en = "Understand how technology redistributes power among countries and how great-power competition constrains what can be built. Anyone creating systems or companies from Argentina operates within supply chains, standards, sanctions, and dependencies decided elsewhere; this course teaches how to read them and how to think strategically from a peripheral position."
content_es = "Competencia tecnológica entre potencias. Estados Unidos, China, Europa y América Latina. Semiconductores, energía, infraestructura digital, datos, estándares, defensa, dual use, sanciones y cadenas de suministro. Soberanía tecnológica, dependencia, alianzas y estrategia nacional en el mundo post-IA."
content_en = "Technological competition among powers. The United States, China, Europe, and Latin America. Semiconductors, energy, digital infrastructure, data, standards, defense, dual use, sanctions, and supply chains. Technological sovereignty, dependence, alliances, and national strategy in the post-AI world."
