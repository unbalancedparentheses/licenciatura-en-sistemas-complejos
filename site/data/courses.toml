[[course]]
slug = "finanzas-dinero-y-banca"
title_es = "Finanzas, Dinero y Banca"
title_en = "Finance, Money, and Banking"
cuatrimestre = 7
position = 1
hours = [4, 4]
audiences = ["students", "faculty", "authorities"]
objective_es = "Entender cómo se financian las cosas, cómo funciona el dinero y en qué entorno macroeconómico opera una empresa. Finanzas corporativas, sistemas monetarios y banca, y la macroeconomía que todo fundador necesita leer: ciclos, inflación, tasas de interés, política monetaria y fiscal."
objective_en = "To understand how things get funded, how money works, and the macroeconomic environment a company operates in. Corporate finance, monetary systems and banking, and the macroeconomics every founder needs to read: cycles, inflation, interest rates, monetary and fiscal policy."
content_es = "Estados financieros, valuación, estructura de capital, unit economics y financiamiento. Dinero, banca, crédito, pagos y bancos centrales. Inflación, tasas de interés, ciclos, política monetaria y fiscal. Riesgo financiero y liquidez. Lectura del entorno macroeconómico para construir empresas e instituciones."
content_en = "Financial statements, valuation, capital structure, unit economics, and financing. Money, banking, credit, payments, and central banks. Inflation, interest rates, cycles, monetary and fiscal policy. Financial risk and liquidity. Reading the macroeconomic environment to build companies and institutions."
texts = [
  "Brealey, Richard A., Stewart C. Myers, and Franklin Allen. <em>Principles of Corporate Finance.</em> 14th ed. McGraw-Hill, 2022.",
  "Mehrling, Perry. <em>The New Lombard Street.</em> Princeton University Press, 2011.",
  "Ammous, Saifedean. <em>The Bitcoin Standard.</em> Wiley, 2018.",
  "Alden, Lyn. <em>Broken Money.</em> Timestamp Press, 2023.",
  { citation = "Minsky, Hyman P. <em>Stabilizing an Unstable Economy.</em> McGraw-Hill, 2008.", note_es = "La inestabilidad financiera es endógena al capitalismo, no un shock externo: las fases hedge / especulativa / Ponzi explican cada crisis financiera desde su publicación.", note_en = "Financial instability is endogenous to capitalism, not an external shock, the hedge / speculative / Ponzi phases explain every financial crisis since publication." },
  { citation = "Hayek, Friedrich A. \"The Use of Knowledge in Society\" and <em>Denationalisation of Money.</em>", note_es = "El orden espontáneo del sistema de precios como mecanismo de coordinación del conocimiento disperso, y la propuesta radical de la competencia monetaria privada.", note_en = "The spontaneous order of the price system as a coordination mechanism for dispersed knowledge, and the radical proposal of private monetary competition." },
  { citation = "Hobart, Byrne, and Tobias Huber. <em>Bubbles and the End of Stagnation.</em> Stripe Press, 2024.", note_es = "Las burbujas como motores del progreso, no solo fuerzas destructivas: cómo la energía especulativa impulsa la adopción tecnológica.", note_en = "Bubbles as engines of progress, not only destructive forces, how speculative energy drives technological adoption." },
]
references = [
  { name = "MIT 15.401 Finance Theory", url = "https://ocw.mit.edu/courses/15-401-finance-theory-i-fall-2008/" },
