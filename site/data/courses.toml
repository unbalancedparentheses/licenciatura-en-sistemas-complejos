[[course]]
slug = "calculo-y-analisis"
title_es = "Cálculo y Análisis"
title_en = "Calculus and Analysis"
year = 1
block = "A"
position = 3
audiences = ["students", "faculty", "authorities"]
objective_es = "Construir el cálculo y el análisis matemático que el resto del programa asume en silencio. Desde límites y continuidad hasta cálculo en varias variables y elementos de análisis real, con el rigor suficiente para que probabilidad, optimización, física, machine learning y procesos estocásticos puedan apoyarse en él en lugar de evitarlo."
objective_en = "To build the calculus and mathematical analysis that the rest of the program silently assumes. From limits and continuity to multivariable calculus and elements of real analysis, with enough rigor that probability, optimization, physics, machine learning, and stochastic processes can rely on it rather than work around it."
content_es = "Límites, continuidad, derivadas y aproximación de Taylor. Integración de Riemann. Sucesiones y series, criterios de convergencia. Cálculo en varias variables: gradientes, jacobianos, hessianos, integrales múltiples. Optimización con restricciones, multiplicadores de Lagrange. Ecuaciones diferenciales ordinarias elementales. Unidad final de análisis real y topología: espacios métricos, compacidad, convergencia uniforme, continuidad como preservación de estructura, teoremas de punto fijo."
content_en = "Limits, continuity, derivatives, and Taylor approximation. Riemann integration. Sequences and series, convergence criteria. Multivariable calculus: gradients, Jacobians, Hessians, multiple integrals. Constrained optimization, Lagrange multipliers. Elementary ordinary differential equations. Closing unit on real analysis and topology: metric spaces, compactness, uniform convergence, continuity as structure preservation, fixed-point theorems."
notes_html_es = "El curso es deliberadamente denso para una sola materia: ocho semanas para material que muchos programas distribuyen en un año entero. La compresión es posible porque corre en paralelo con Razonamiento Formal y Demostración, donde se construye la disciplina de prueba que el cálculo riguroso requiere, y con Álgebra Lineal y Computación I, que provee el lenguaje vectorial. La meta no es agotar a Tao, es que Probabilidad, Procesos Estocásticos, Física, Machine Learning y los cursos de optimización puedan asumir el cálculo en lugar de trabajar a su alrededor."
notes_html_en = "The course is deliberately dense for a single block: eight weeks for material many programs spread over a full year. The compression is possible because it runs in parallel with Razonamiento Formal y Demostración, where the proof discipline rigorous calculus requires is built, and with Álgebra Lineal y Computación I, which provides the vector language. The goal is not to exhaust Tao, it is for Probabilidad, Procesos Estocásticos, Física, Machine Learning, and the optimization courses to be able to assume calculus rather than work around it."
texts = [
  { citation = "Spivak, Michael. <em>Calculus.</em> 4th ed. Publish or Perish, 2008.", note_es = "Cálculo de una variable tratado con rigor, escrito como introducción al análisis real.", note_en = "Single-variable calculus treated rigorously, written as an introduction to real analysis." },
  { citation = "Tao, Terence. <em>Analysis I.</em> Hindustan Book Agency, 2016.", note_es = "Análisis real construido desde los axiomas de los reales, autocontenido y riguroso.", note_en = "Real analysis built from the axioms of the reals, self-contained and rigorous." },
  { citation = "Hubbard, John H., and Barbara Burke Hubbard. <em>Vector Calculus, Linear Algebra, and Differential Forms.</em> 5th ed. Matrix Editions, 2015.", note_es = "Cálculo en varias variables con álgebra lineal y formas diferenciales, el puente natural hacia ML, optimización y física.", note_en = "Multivariable calculus with linear algebra and differential forms, the natural bridge into ML, optimization, and physics." },
  { citation = "Strogatz, Steven H. <em>Nonlinear Dynamics and Chaos.</em> 2nd ed. CRC Press, 2014.", note_es = "Capítulos seleccionados sobre EDO y comportamiento cualitativo, conexión temprana con Sistemas Complejos.", note_en = "Selected chapters on ODEs and qualitative behavior, an early bridge to Sistemas Complejos." },
  { citation = "Munkres, James R. <em>Topology.</em> 2nd ed. Pearson, 2000.", note_es = "Capítulos seleccionados de topología de conjuntos de puntos para la unidad final: espacios métricos, compacidad, continuidad.", note_en = "Selected chapters of point-set topology for the closing unit: metric spaces, compactness, continuity." },
]
references = [
