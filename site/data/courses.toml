objective_en = "To understand how order, chaos, and structure emerge from the interaction of simple agents, and why complex systems resist prediction and centralized control."
content_es = "Comportamiento emergente, redes complejas, modelos basados en agentes, transiciones de fase, autoorganización, power laws, coevolución. Los patrones de complejidad atraviesan dominios."
content_en = "Emergent behavior, complex networks, agent-based models, phase transitions, self-organization, power laws, coevolution. Complexity patterns cross domains."
notes_html_es = "Conecta todo: Biología (Año 1) con Economía (Año 1–2) con Redes (Año 2) con Instituciones (Año 2) con Riesgo y fat tails (Año 2). Los patrones de complejidad atraviesan los dominios: la falla en cascada de una red eléctrica, una corrida bancaria, una epidemia y un colapso institucional son el mismo fenómeno visto desde distintas disciplinas."
notes_html_en = "Connects everything: Biología (Año 1) with Economía (Año 1–2) with Redes (Año 2) with Instituciones (Año 2) with Riesgo y fat tails (Año 2). Complexity patterns cross domains, the cascade failure in a power grid, a bank run, an epidemic, and an institutional collapse are the same phenomenon viewed from different disciplines."
