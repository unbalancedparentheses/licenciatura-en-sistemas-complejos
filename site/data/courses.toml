  { citation = "Chandler, Alfred D. <em>The Visible Hand.</em> Harvard University Press, 1977.", note_es = "La revolución gerencial y cómo las organizaciones se volvieron la forma dominante de coordinación.", note_en = "The managerial revolution and how organizations became the dominant form of coordination." },
  { citation = "Perez, Carlota. <em>Technological Revolutions and Financial Capital.</em> Edward Elgar, 2002.", note_es = "Teoría de los ciclos largos de tecnología, capital y ajuste institucional.", note_en = "Long-cycle theory of technology, capital, and institutional adjustment." },
  "Brynjolfsson, Erik, and Andrew McAfee. <em>The Second Machine Age.</em> W. W. Norton, 2014.",
]
references = [
