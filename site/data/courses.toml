objective_es = "Entender cómo las organizaciones, los estados, los mercados y las tecnologías transformadoras realmente funcionan — y cómo fallan. Casos históricos como tests de estrés de modelos de gobernanza, junto al estudio de cómo cada gran transición tecnológica reorganizó el poder, la economía y las formas de vida."
objective_en = "To understand how organizations, states, markets, and transformative technologies actually work — and how they fail. Historical cases as stress tests of governance models, together with the study of how each major technological transition reorganized power, economy, and forms of life."
content_es = "Primera mitad — instituciones: modos de falla institucional y sus causas estructurales. Por qué colapsan los imperios, por qué los regímenes regulatorios se calcifican, por qué organizaciones efectivas se vuelven patológicas. Segunda mitad — tecnología como motor de cambio: la imprenta, la máquina de vapor, la electricidad, la computadora, internet, la IA. Cómo cada tecnología cambió qué tipos de organizaciones son posibles, quién tiene poder, y qué formas de vida se vuelven imaginables."
content_en = "First half — institutions: institutional failure modes and their structural causes. Why empires collapse, why regulatory regimes calcify, why effective organizations become pathological. Second half — technology as engine of change: the printing press, steam engine, electricity, computer, internet, AI. How each technology changed what kinds of organizations are possible, who holds power, and what forms of life become imaginable."
